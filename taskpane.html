<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérificateur Pivot Social Media</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>*{box-sizing:border-box}body{margin:0;background:#f0f4f8}@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .rl{color:#2563eb;cursor:pointer;text-decoration:underline}table{max-width:100%}button:disabled{opacity:.5;cursor:not-allowed}</style>
</head>
<body>
  <div id="root"></div>
  <script>

const { useState, useEffect, useRef } = React;

const CONFIG={
  webMin:2500,          // visibilité minimale d'un site web
  webMax:500000,        // au-delà : à vérifier (source de visibilité)
  excludedBrands:['tp_michelin'], // colonnes de marques ignorées pour la cohérence avec Commentaires
  contact:'Clément',    // personne à contacter pour les plateformes non standards
  maxEmptyRows:50,      // lignes vides consécutives après lesquelles la lecture s'arrête
  outlierFactor:10,     // alerte si visibilité > N × médiane de la plateforme
  outlierMinRows:8      // nombre minimal de posts dans la plateforme pour ce contrôle
};
const ROWBUF=[];
const fmtN=(n)=>n.toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ');
const fixTxt=(s)=>typeof s==='string'?s.replace(/2[\s\u00a0\u202f]500/g,fmtN(CONFIG.webMin)).replace(/500[\s\u00a0\u202f]000/g,fmtN(CONFIG.webMax)):s;
const X = () => ({ utils: {
  decode_range: (ref) => {
    const colN = (s) => s.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
    let m = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(ref);
    if(!m){const k=/^([A-Z]+)(\d+)$/.exec(ref);m=[0,k[1],k[2],k[1],k[2]];}
    return { s: { c: colN(m[1]), r: +m[2] - 1 }, e: { c: colN(m[3]), r: +m[4] - 1 } };
  },
  encode_cell: ({ r, c }) => { let s = '', n = c + 1; while (n > 0) { const k = (n - 1) % 26; s = String.fromCharCode(65 + k) + s; n = Math.floor((n - 1) / 26); } return s + (r + 1); }
}});
const cs = (c) => { if(!c||c.t==='e')return null; const v=c.v; if(v===null||v===undefined||v==='')return null; return v.toString().trim()||null; };
const cn = (c) => { if(!c||c.t==='e')return null; const v=c.v; if(v===null||v===undefined||v==='')return null; const n=Number(v); return isNaN(n)?null:n; };
const isE = (c) => c&&c.t==='e';
const nP = (s) => s?s.toString().trim().toLowerCase():'';
const isP = (v,...pp) => pp.includes(nP(v));

function bCM(ws) {
  const r=X().utils.decode_range(ws['!ref']||'A1:A1');
  const m={_mxC:r.e.c,_mxR:r.e.r,_mnR:r.s.r,_mnC:r.s.c};
  for(let c=r.s.c;c<=r.e.c;c++){
    const cell=ws[X().utils.encode_cell({r:r.s.r,c})];
    if(cell&&cell.v!==undefined&&cell.v!==null&&cell.v!==''){
      const k=cell.v.toString().trim().toLowerCase();
      if(m[k]===undefined)m[k]=c;
      m['_h'+c]=cell.v.toString().trim();
    }
  }
  return m;
}
const COL_ALIASES={'plateforme':['social_media'],'id post':['post_id'],'id_post':['post_id'],'url':['post_url'],'id page':['author_id'],'id_page':['author_id'],'compte ou requête':['compte','account_name'],'compte ou requete':['compte','account_name'],'social actions':['engagements'],'social_actions':['engagements'],'équivalent média':['emv net/ratio'],'equivalent media':['emv net/ratio']};
const gc = (m,...ns) => { for(const n of ns){const k=n.toLowerCase().trim();if(m[k]!==undefined)return m[k];} for(const n of ns){const al=COL_ALIASES[n.toLowerCase().trim()];if(al)for(const a of al){if(m[a]!==undefined)return m[a];}} return -1; };
const gcAll = (m,...ns) => { const res=[]; for(let c=m._mnC;c<=m._mxC;c++){const h=m['_h'+c];if(!h)continue;const hk=h.toLowerCase().trim();for(const n of ns){if(hk===n.toLowerCase().trim()){res.push(c);break;}}} return res; };

const __GRC=new WeakMap(),__CN=[];
const __cn=(c)=>__CN[c]||(__CN[c]=(()=>{let s='',n=c+1;while(n>0){const k=(n-1)%26;s=String.fromCharCode(65+k)+s;n=Math.floor((n-1)/26);}return s;})());
const __cellAt=(ws,ri,c)=>{const g=ws['!grid'];if(g){const rw=g[ri-g.r0];return rw?rw[c]:undefined;}return ws[__cn(c)+(ri+1)];};
function gR(ws, from) {
  let m=__GRC.get(ws);if(!m){m={};__GRC.set(ws,m);}
  const ck=from+'|'+CONFIG.maxEmptyRows;if(m[ck])return m[ck];
  const r=X().utils.decode_range(ws['!ref']||'A1:A1');
  const rows=[]; let consec=0; const c0=r.s.c,c1=r.e.c,L=[];for(let c=c0;c<=c1;c++)L[c]=__cn(c);
  const g=ws['!grid'];
  for(let ri=from;ri<=r.e.r;ri++){
    let any=false; const rn=ri+1; let d;
    if(g){
      const rw=g[ri-g.r0];
      if(rw){d=rw;for(let c=c0;c<=c1;c++){const cell=rw[c];if(cell&&cell.v!==undefined&&cell.v!==null&&cell.v!==''){any=true;break;}}}
    }else{
      d={};
      for(let c=c0;c<=c1;c++){
        const cell=ws[L[c]+rn];
        d[c]=cell||null;
        if(cell&&cell.v!==undefined&&cell.v!==null&&cell.v!=='')any=true;
      }
    }
    if(any){consec=0;rows.push({ri,er:rn,d});}
    else{consec++;if(consec>=CONFIG.maxEmptyRows)break;}
  }
  m[ck]=rows;
  return rows;
}
const fL=(ls,mx=20)=>{ for(const x of ls)ROWBUF.push(x); if(!ls.length)return''; if(ls.length<=mx)return ls.join(', '); return ls.slice(0,mx).join(', ')+` … (${ls.length} lignes)`;};
function gBP(rows,pc){const g={};for(const r of rows){const p=nP(cs(r.d[pc]))||'(vide)';(g[p]=g[p]||[]).push(r.er);ROWBUF.push(r.er);}return g;}
const fG=(g,mx=5)=>Object.entries(g).map(([p,ls])=>ls.length>mx?`<strong>${p}</strong> : ${ls.length} lignes`:`<strong>${p}</strong> : lignes ${ls.join(', ')}`).join('<br>');
const pp=(res,sec,id,st,lb,msg,extra)=>{const rows=[...new Set(ROWBUF)];ROWBUF.length=0;const fx=(id==='c20'||id==='c21');res.push({sec,id,st,lb:fx?fixTxt(lb):lb,msg:fx?fixTxt(msg):msg,rows,...(extra||{})});};

const STD=['facebook','instagram','twitter','youtube','linkedin','twitch','tiktok','story','websites'];
const EXP=['DATA','TABLEAUX','INDEX','Commentaires'];

function analyze(wb){
  const gs=(name)=>{const s=wb.SheetNames.find(n=>n.toLowerCase()===name.toLowerCase());return s?wb.Sheets[s]:null;};
  const dWs=gs('data'),tWs=gs('tableaux'),iWs=gs('index'),cWs=gs('commentaires');
  const res=[];
  if(!dWs){pp(res,'DATA','nd','w','Onglet DATA manquant',"L'onglet DATA est introuvable.");return res;}
  aData(dWs,cWs,res);
  tWs?aTab(tWs,dWs,res):pp(res,'TABLEAUX','nt','w','Onglet TABLEAUX manquant',"L'onglet TABLEAUX est introuvable.");
  iWs?aIdx(iWs,dWs,res):pp(res,'INDEX','ni','w','Onglet INDEX manquant',"L'onglet INDEX est introuvable.");
  aRap(dWs,res);
  return res;
}

function aData(ws,cWs,res){
  const m=bCM(ws), rows=gR(ws,2);
  if(!rows.length){pp(res,'DATA','de','w','Aucune donnée dans DATA',"L'onglet DATA ne contient aucune ligne (à partir de la ligne 3).");return;}
  const PC=gc(m,'plateforme'),IC=gc(m,'id post','id_post'),DC=gc(m,'date');
  const MoC=gc(m,'mois'),JC=gc(m,'jour'),SC=gc(m,'semestre'),AC=gc(m,'année','annee');
  const RTC=gc(m,'rt (tw)','rt(tw)'),RPC=gc(m,'reply (tw)','reply(tw)');
  const IDPC=gc(m,'id page','id_page'),CC=gc(m,'compte ou requête','compte ou requete'),UC=gc(m,'url');
  const VC=gc(m,'vues'),SAC=gc(m,'saves'),LKC=gc(m,'likes'),CMC=gc(m,'comments','commentaires');
  const SOAC=gc(m,'social actions','social_actions'),OEC=gc(m,'owned/paid/earned','owned_paid_earned');
  const DEPC=gc(m,'dépenses paid','depenses paid'),RVC=gc(m,'ratio visibilité','ratio visibilite','ratio_visibilite');
  const VISC=gc(m,'visibilité','visibilite'),EQC=gc(m,'équivalent média','equivalent media');
  const IMPC=gc(m,'imp_tt_ou_connues','imp_tt'),SCPC=gc(m,'scope');
  const DETC=gc(m,'detection textuelle ?','detection textuelle','détection textuelle ?');
  const INDC=gc(m,'impression_indiquées','impression_indiquees','impression indiquées');

  if(PC===-1)pp(res,'DATA','c1','w','Colonne "plateforme" introuvable','Colonne "plateforme" non trouvée dans DATA.');
  else{const e=rows.filter(r=>!cs(r.d[PC]));e.length?pp(res,'DATA','c1','w',`Plateforme — ${e.length} valeur(s) manquante(s)`,`Cellules vides dans "plateforme" — lignes : ${fL(e.map(r=>r.er))}`):pp(res,'DATA','c1','ok','Plateforme — complète','Aucune cellule vide dans "plateforme".');}

  if(IC===-1)pp(res,'DATA','c2','w','Colonne "ID Post" introuvable','Colonne "ID Post" non trouvée dans DATA.');
  else{const e=rows.filter(r=>!cs(r.d[IC]));if(e.length){const g=gBP(e,PC);pp(res,'DATA','c2','w',`IDs Post manquants (${e.length})`,`${e.length} ID${e.length>1?'s':''} Post manquant${e.length>1?'s':''} :<br>${fG(g)}`);}else pp(res,'DATA','c2','ok','ID Post — complet','Tous les IDs Post sont renseignés.');}

  if(DC===-1)pp(res,'DATA','c3','w','Colonne "Date" introuvable','Colonne "Date" non trouvée dans DATA.');
  else{const e=rows.filter(r=>!r.d[DC]||r.d[DC].v===undefined||r.d[DC].v===null||r.d[DC].v==='');e.length?pp(res,'DATA','c3','w',`Date — ${e.length} valeur(s) manquante(s)`,`Dates manquantes — lignes : ${fL(e.map(r=>r.er))}`):pp(res,'DATA','c3','ok','Date — complète','Toutes les dates sont renseignées.');}

  const fcs=[{n:'mois',c:MoC},{n:'jour',c:JC},{n:'semestre',c:SC},{n:'année',c:AC},{n:'RT (TW)',c:RTC},{n:'Reply (TW)',c:RPC}];
  const fM=[],fI=[];const legacyTW=gc(m,'is_retweet','is_reply')!==-1;
  for(const fc of fcs){if(fc.c===-1&&legacyTW&&(fc.n==='RT (TW)'||fc.n==='Reply (TW)'))continue;if(fc.c===-1){fM.push(fc.n);}else{const e=rows.filter(r=>!r.d[fc.c]||r.d[fc.c].v===undefined||r.d[fc.c].v===null||r.d[fc.c].v==='');if(e.length)fI.push(`<strong>${fc.n}</strong> : ${e.length} cellule${e.length>1?'s vides':' vide'} — lignes : ${fL(e.map(r=>r.er))}`);}}
  if(fM.length||fI.length){let msg='';if(fM.length)msg+=`Colonnes introuvables : ${fM.join(', ')}<br>`;if(fI.length)msg+=`Formules non étendues :<br>${fI.join('<br>')}`;pp(res,'DATA','c4','w','Colonnes à formule — non étendues',msg);}
  else pp(res,'DATA','c4','ok','Colonnes à formule — toutes étendues','mois, jour, semestre, année, RT (TW), Reply (TW) renseignées sur toutes les lignes.');

  const c5=[];
  if(IDPC===-1)c5.push('Colonne "ID Page" introuvable');
  else{const e=rows.filter(r=>!cs(r.d[IDPC]));if(e.length){const g=gBP(e,PC);c5.push(`"ID Page" vide (${e.length} lignes) :<br>${fG(g)}`);}}
  if(CC===-1)c5.push('Colonne "Compte ou Requête" introuvable');
  else{const e=rows.filter(r=>!cs(r.d[CC]));if(e.length){const g=gBP(e,PC);c5.push(`"Compte ou Requête" vide (${e.length} lignes) :<br>${fG(g)}`);}}
  c5.length?pp(res,'DATA','c5','w','ID Page / Compte ou Requête — manquants',c5.join('<br><br>')):pp(res,'DATA','c5','ok','ID Page / Compte ou Requête — complets','Toutes les valeurs sont renseignées.');

  if(UC!==-1&&PC!==-1){
    const fbR=rows.filter(r=>isP(cs(r.d[PC]),'facebook'));
    const pat=/^https:\/\/www\.facebook\.com\/\d+_\d+$/;
    const reelR=fbR.filter(r=>{const u=cs(r.d[UC]);return u&&/\/reel\//i.test(u);});
    const bad=fbR.filter(r=>{const u=cs(r.d[UC]);return!u||(!pat.test(u)&&!/\/reel\//i.test(u));});
    if(bad.length)pp(res,'DATA','c6','w','URLs Facebook — format incorrect',`${bad.length} URL${bad.length>1?'s':''} non conformes — bien prendre le toplevel URL Apify au format <code>https://www.facebook.com/143692875711931_1388589896629451</code><br>Lignes : ${fL(bad.map(r=>r.er))}`);
    else if(fbR.length)pp(res,'DATA','c6','ok','URLs Facebook — conformes',`Toutes les URLs Facebook (${fbR.length}) sont conformes.`);
    else pp(res,'DATA','c6','i','URLs Facebook — aucune ligne Facebook','Aucune ligne "facebook" détectée.');
    if(reelR.length)pp(res,'DATA','c6r','i','URLs Facebook — Reels détectés',`${reelR.length} URL${reelR.length>1?'s':''} de type Reel détectée${reelR.length>1?'s':''} (contient "/reel/") — format différent du standard, vérifier la collecte. Pas besoin de corriger. Lignes : ${fL(reelR.map(r=>r.er))}`);
  } else pp(res,'DATA','c6','i','URLs Facebook — impossible','Colonnes "URL" ou "plateforme" introuvables.');

  if(IC!==-1&&PC!==-1){
    const fbR=rows.filter(r=>isP(cs(r.d[PC]),'facebook'));
    const pfb=fbR.filter(r=>{const v=cs(r.d[IC]);return v&&v.toLowerCase().startsWith('pfbid');});
    if(pfb.length)pp(res,'DATA','c6p','w','ID Post Facebook — format pfbid détecté',`${pfb.length} ID${pfb.length>1?'s':''} Post Facebook commençant par "pfbid" — on attend un format numérique (ex : <code>143692875711931_1388589896629451</code>). Lignes : ${fL(pfb.map(r=>r.er))}`);
  }

  if(VC!==-1&&PC!==-1){const ytR=rows.filter(r=>isP(cs(r.d[PC]),'youtube','tiktok'));const miss=ytR.filter(r=>cn(r.d[VC])===null);if(miss.length){const g=gBP(miss,PC);pp(res,'DATA','c7','w','Vues YouTube/TikTok manquantes',`${miss.length} ligne${miss.length>1?'s':''} sans vues :<br>${fG(g)}`);}else if(ytR.length)pp(res,'DATA','c7','ok','Vues YouTube/TikTok — complètes',`Toutes les lignes YouTube/TikTok (${ytR.length}) ont des vues.`);else pp(res,'DATA','c7','i','Vues YouTube/TikTok — aucune ligne','Aucune ligne YouTube ou TikTok.');}
  else pp(res,'DATA','c7','i','Vues YouTube/TikTok — impossible','Colonnes "vues" ou "plateforme" introuvables.');

  if(LKC!==-1&&CMC!==-1&&PC!==-1){const excl=['story','twitch','websites'];const elig=rows.filter(r=>{const p=nP(cs(r.d[PC]));return!excl.includes(p)&&p!=='';});const mL=elig.filter(r=>cn(r.d[LKC])===null);const mC=elig.filter(r=>cn(r.d[CMC])===null);const is=[];if(mL.length){const g=gBP(mL,PC);is.push(`<strong>Likes manquants</strong> (${mL.length} lignes) :<br>${fG(g)}`);}if(mC.length){const g=gBP(mC,PC);is.push(`<strong>Comments manquants</strong> (${mC.length} lignes) :<br>${fG(g)}`);}is.length?pp(res,'DATA','c8','w','Likes et Commentaires manquants',is.join('<br><br>')):pp(res,'DATA','c8','ok','Likes et Commentaires — complets','Toutes les valeurs sont renseignées.');}
  else pp(res,'DATA','c8','i','Likes/Comments — impossible','Colonnes "likes", "comments" ou "plateforme" introuvables.');

  if(LKC!==-1&&PC!==-1){const igR=rows.filter(r=>isP(cs(r.d[PC]),'instagram'));const hid=igR.filter(r=>{const v=cn(r.d[LKC]);return v===null||v===-1;});if(hid.length)pp(res,'DATA','c9','w','Engagement caché Instagram non corrigé',`Attention, ${hid.length} post${hid.length>1?'s':''} Instagram avec engagement caché non corrigé${hid.length>1?'s':''} (likes = -1 ou vide) — lignes : ${fL(hid.map(r=>r.er))}`);else if(igR.length)pp(res,'DATA','c9','ok','Engagement caché Instagram — OK','Aucun post Instagram avec engagement caché non corrigé.');else pp(res,'DATA','c9','i','Engagement Instagram — aucune ligne','Aucune ligne Instagram.');}

  if(SOAC!==-1&&PC!==-1){const e=rows.filter(r=>{const p=nP(cs(r.d[PC]));return p!=='story'&&p!=='websites'&&cn(r.d[SOAC])===null;});if(e.length){const g=gBP(e,PC);pp(res,'DATA','c10','w','Social Actions — valeurs manquantes',`${e.length} ligne${e.length>1?'s':''} sans "Social Actions" :<br>${fG(g)}`);}else pp(res,'DATA','c10','ok','Social Actions — complet','Toutes les valeurs "Social Actions" sont renseignées.');}
  else pp(res,'DATA','c10','i','Social Actions — impossible','Colonne "Social Actions" introuvable.');

  if(OEC!==-1){const valid=['owned','paid','earned'];const inv=[],bCase=[];for(const r of rows){const v=cs(r.d[OEC]);if(!v||!valid.includes(v.toLowerCase().trim()))inv.push(r);else if(v.trim()!==v.toLowerCase().trim())bCase.push(r);}const is=[];if(inv.length){const g=gBP(inv,PC);is.push(`Valeurs invalides/manquantes (${inv.length} lignes) :<br>${fG(g)}`);}if(bCase.length)is.push(`Incohérence de casse dans owned/paid/earned — uniformiser en minuscules. (${bCase.length} ligne${bCase.length>1?'s':''})`);is.length?pp(res,'DATA','c11','w','owned/paid/earned — incohérences',is.join('<br><br>')):pp(res,'DATA','c11','ok','owned/paid/earned — conforme','Toutes les valeurs sont en minuscules.');}
  else pp(res,'DATA','c11','i','owned/paid/earned — impossible','Colonne introuvable.');

  const twR=rows.filter(r=>isP(cs(r.d[PC]),'twitter','x'));
  if(twR.length){if(IMPC===-1)pp(res,'DATA','c13','w','Twitter — "imp_tt_ou_connues" introuvable','Colonne des impressions Twitter non trouvée.');else{const is=[],noI=[],wrC=[];for(const r of twR){const iv=cn(r.d[IMPC]);const vv=VC!==-1?cn(r.d[VC]):null;if(iv===null){if(vv!==null&&vv>0)wrC.push(r.er);else noI.push(r.er);}}if(wrC.length)is.push(`Erreur : les impressions Twitter doivent être dans imp_tt_ou_connues et non dans vues — lignes : ${fL(wrC)}`);if(noI.length)is.push(`Impressions Twitter manquantes (${noI.length} ligne${noI.length>1?'s':''}) — lignes : ${fL(noI)}`);is.length?pp(res,'DATA','c13','w','Twitter — Impressions',is.join('<br>')):pp(res,'DATA','c13','ok','Twitter — Impressions complètes',`Toutes les impressions Twitter (${twR.length} lignes) sont dans imp_tt_ou_connues.`);}}
  else pp(res,'DATA','c13','i','Twitter — aucune ligne','Aucune ligne Twitter/X.');

  if(twR.length){if(SAC===-1)pp(res,'DATA','c14','w','Twitter — "saves" introuvable','Colonne "saves" non trouvée.');else{const ms=twR.filter(r=>cn(r.d[SAC])===null);ms.length?pp(res,'DATA','c14','w','Twitter — Mise à jour engagement manquante',`Mise à jour engagement Twitter manquante pour ${ms.length} ligne${ms.length>1?'s':''} (saves vide) — lignes : ${fL(ms.map(r=>r.er))}`):pp(res,'DATA','c14','ok','Twitter — Saves complets','Toutes les lignes Twitter ont des saves.');}}

  const stR=rows.filter(r=>isP(cs(r.d[PC]),'story'));
  if(stR.length){
    const followerCols=[];for(let c=m._mnC;c<=m._mxC;c++){const h=m['_h'+c];if(h&&h.toLowerCase().includes('followers'))followerCols.push(c);}
    const mf=stR.filter(r=>followerCols.length===0||!followerCols.some(c=>cn(r.d[c])!==null));
    const colNames=followerCols.map(c=>m['_h'+c]).join(', ')||'(aucune colonne "followers" trouvée)';
    mf.length?pp(res,'DATA','c15','w','Story — Followers manquants',`Followers manquants pour les posts story — ${mf.length} ligne${mf.length>1?'s':''} sans valeur numérique dans les colonnes followers détectées (${colNames}) — lignes : ${fL(mf.map(r=>r.er))}`):pp(res,'DATA','c15','ok','Story — Followers complets',`Tous les posts story ont des followers renseignés (colonnes : ${colNames}).`);
  } else pp(res,'DATA','c15','i','Story — aucune ligne','Aucune ligne "story".');

  if(OEC!==-1){const pR=rows.filter(r=>{const v=cs(r.d[OEC]);return v&&v.toLowerCase().trim()==='paid';});if(pR.length){if(DEPC===-1)pp(res,'DATA','c16','w','Paid — "dépenses paid" introuvable','Colonne "dépenses paid" non trouvée.');else{const md=pR.filter(r=>cn(r.d[DEPC])===null);if(md.length){const g=gBP(md,PC);pp(res,'DATA','c16','w','Paid — Dépenses non indiquées',`Dépenses paid non indiquées pour ${md.length} ligne${md.length>1?'s':''} :<br>${fG(g)}`);}else pp(res,'DATA','c16','ok','Paid — Dépenses complètes','Toutes les lignes "paid" ont des dépenses renseignées.');}}else pp(res,'DATA','c16','i','Paid — aucune ligne "paid"','Aucune ligne avec owned/paid/earned = "paid".');}

const median=(a)=>{const s=[...a].sort((x,y)=>x-y);const n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;};
const NUMRE=/^\s*-?\d+(?:[.,]\d+)?\s*$/;
const WSRE=/^[\s ​]+|[\s ​]+$/;

function aExtra(wb,res){
  const dName=wb.SheetNames.find(n=>n.toLowerCase()==='data'); if(!dName)return;
  const ws=wb.Sheets[dName]; const m=bCM(ws); const rows=gR(ws,2); if(!rows.length)return;
  const g=(...n)=>gc(m,...n);
  const PC=g('plateforme'),OEC=g('owned/paid/earned','owned_paid_earned'),CC=g('compte ou requête','compte ou requete'),SCC=g('scope'),IC=g('id post','id_post'),IDPC=g('id page','id_page'),UC=g('url'),DC=g('date');

  if(r11&&OEC!==-1)r11.rows=rows.filter(r=>{const v=cs(r.d[OEC]);return !v||!['owned','paid','earned'].includes(v.toLowerCase().trim())||v.trim()!==v.toLowerCase().trim();}).map(r=>r.er);

  if(r22){const set=new Set();for(const c of [IC,UC]){if(c===-1)continue;const mp={};for(const r of rows){const v=cs(r.d[c]);if(v)(mp[v]=mp[v]||[]).push(r.er);}for(const k in mp)if(mp[k].length>1)mp[k].forEach(x=>set.add(x));}r22.rows=[...set];}
  const r29=res.find(x=>x.id==='c29'&&x.st==='w'); if(r29)r29.rows=['B2'];

  // c40 — espaces parasites

  {const cnt={},rr=new Set();
   for(const [n,c] of wsCols)for(const r of rows){const cell=r.d[c];if(cell&&cell.t==='s'&&typeof cell.v==='string'&&WSRE.test(cell.v)){cnt[n]=(cnt[n]||0)+1;rr.add(r.er);}}
   if(rr.size){const det=Object.entries(cnt).map(([n,c])=>`<strong>${n}</strong> : ${c} cellule${c>1?'s':''}`).join(', ');
     pp(res,'DATA','c40','w',`Espaces parasites (${rr.size} ligne${rr.size>1?'s':''})`,`Espaces en début ou fin de cellule — ${det}<br>Lignes : ${fL([...rr])}`);}
   else pp(res,'DATA','c40','ok','Espaces parasites — aucun','Aucun espace en début/fin dans plateforme, compte, scope, IDs et URL.');}

  // c41 — variantes d'écriture

   const cnt={},rr=new Set();

   if(rr.size){const det=Object.entries(cnt).map(([n,c])=>`<strong>${n}</strong> : ${c}`).join(', ');
     pp(res,'DATA','c42','w',`Nombres stockés en texte (${rr.size} ligne${rr.size>1?'s':''})`,`Cellules numériques au format texte — ${det}<br>Lignes : ${fL([...rr])}`);}

  // c43 — dates en texte
  if(DC!==-1){const bad=rows.filter(r=>{const c=r.d[DC];return c&&c.t==='s'&&typeof c.v==='string'&&c.v.trim()!=='';});

  // c44 — engagement > visibilité
  if(VISC!==-1&&PC!==-1&&(SOAC!==-1||(LKC!==-1&&CMC!==-1))){
    const bad=rows.filter(r=>{const p=nP(cs(r.d[PC]));if(!p||p==='websites'||p==='story')return false;const vis=cn(r.d[VISC]);if(vis===null||vis<=0)return false;const so=SOAC!==-1?cn(r.d[SOAC]):null;const eng=SOAC!==-1?(so||0):((LKC!==-1?cn(r.d[LKC])||0:0)+(CMC!==-1?cn(r.d[CMC])||0:0));return eng>vis;});
    if(bad.length){const gg=gBP(bad,PC);pp(res,'DATA','c44','w',`Engagement supérieur à la visibilité (${bad.length})`,`${bad.length} ligne${bad.length>1?'s':''} où l'engagement dépasse la visibilité :<br>${fG(gg)}`);}
    else pp(res,'DATA','c44','ok','Engagement / visibilité — cohérents','Aucun post avec plus d\'engagement que de visibilité.');}

  // c45 — valeurs aberrantes par plateforme
  if(VISC!==-1&&PC!==-1){const pg={};for(const r of rows){const p=nP(cs(r.d[PC]));if(!p||p==='websites'||p==='story')continue;const v=cn(r.d[VISC]);if(v!==null&&v>0)(pg[p]=pg[p]||[]).push({r,v});}
    const flagged=[],lines=[];
    for(const [p,arr] of Object.entries(pg)){if(arr.length<CONFIG.outlierMinRows)continue;const med=median(arr.map(x=>x.v));if(med<=0)continue;const out=arr.filter(x=>x.v>CONFIG.outlierFactor*med);if(out.length){out.forEach(x=>flagged.push(x.r));const mx=Math.max(...out.map(x=>x.v));lines.push(`<strong>${p}</strong> : ${out.length} post${out.length>1?'s':''} > ${CONFIG.outlierFactor} × la médiane (${Math.round(med).toLocaleString('fr-FR')}) — max ${Math.round(mx).toLocaleString('fr-FR')}`);}}
    if(flagged.length){pp(res,'DATA','c45','w',`Visibilités très au-dessus de la médiane (${flagged.length})`,lines.join('<br>')+'<br>Lignes : '+fL(flagged.map(r=>r.er)));}
    else pp(res,'DATA','c45','ok','Visibilités — pas de valeur aberrante',`Aucune visibilité > ${CONFIG.outlierFactor} × la médiane de sa plateforme.`);}

  // c46 — données après un bloc de lignes vides (non lues)
  {const rg=X().utils.decode_range(ws['!ref']||'A1:A1');const last=rows[rows.length-1].ri;const lost=new Set();
   for(let ri=last+CONFIG.maxEmptyRows+1;ri<=rg.e.r;ri++)for(let c=rg.s.c;c<=rg.e.c;c++){if(__cellAt(ws,ri,c)){lost.add(ri+1);break;}}
   if(lost.size)pp(res,'DATA','c46','w',`Données après des lignes vides (${lost.size} ligne${lost.size>1?'s':''})`,`Après ${CONFIG.maxEmptyRows} lignes vides consécutives, l'analyse s'arrête : ces lignes ne sont pas contrôlées — lignes : ${fL([...lost])}`);}

  // c47 — format des URLs par plateforme (Facebook est contrôlé à part ; websites et stories exclus)
  if(UC!==-1&&PC!==-1){
    const pats={instagram:/^https:\/\/(www\.)?instagram\.com\//,twitter:/^https:\/\/(www\.)?(x|twitter)\.com\//,x:/^https:\/\/(www\.)?(x|twitter)\.com\//,linkedin:/^https:\/\/([a-z]{2,3}\.|www\.)?linkedin\.com\//,tiktok:/^https:\/\/(www\.|vm\.|m\.)?tiktok\.com\//,youtube:/^https:\/\/((www\.|m\.|music\.)?youtube\.com|youtu\.be)\//,twitch:/^https:\/\/(www\.|m\.)?twitch\.tv\//};
    let checked=0;
    const bad=rows.filter(r=>{const p=nP(cs(r.d[PC]));const u=cs(r.d[UC]);if(!u||!pats[p])return false;checked++;return !pats[p].test(u)||/\s/.test(u);});
    if(bad.length){const gg=gBP(bad,PC);pp(res,'DATA','c47','w',`URLs non conformes à la plateforme (${bad.length})`,`${bad.length} URL${bad.length>1?'s':''} avec un mauvais domaine, sans https ou contenant un espace :<br>${fG(gg)}<br>Lignes : ${fL(bad.map(r=>r.er))}`);}
    else if(checked)pp(res,'DATA','c47','ok','URLs des autres plateformes — conformes',`${checked} URL${checked>1?'s':''} vérifiée${checked>1?'s':''} (instagram, twitter/x, linkedin, tiktok, youtube, twitch).`);
  }

  // récapitulatif et tops : mêmes colonnes de marque (filtrables dans le volet)
  if(PC!==-1){
    // colonnes de marque : entre « impression… » et la colonne « commentaires » (ou « detection textuelle »), puis toutes les autres colonnes
    const headers=[];for(let c=m._mnC;c<=m._mxC;c++){const hh=m['_h'+c];if(hh)headers.push({c,name:hh,low:hh.toLowerCase().trim()});}

    const isOn=(cell)=>{if(!cell||cell.v===undefined||cell.v===null||cell.v==='')return false;if(typeof cell.v==='number')return cell.v!==0;const s=String(cell.v).trim().toLowerCase();return !['','0','false','faux','non','no','-'].includes(s);};
    const EQC=g('équivalent média','equivalent media'),DEPC=g('dépenses paid','depenses paid');
    const tN=wb.SheetNames.find(n=>n.toLowerCase()==='tableaux');const b2=tN?cs(wb.Sheets[tN]['B2']):null;
    // colonnes « catégorielles » (≤ 60 valeurs distinctes) utilisables pour définir une période

    const cats=[];
    for(let c=m._mnC;c<=m._mxC;c++){
      const name=m['_h'+c];if(!name)continue;const cm=new Map();let ok=true;
      for(const r of rows){const cell=r.d[c];if(!cell||cell.v===undefined||cell.v===null||cell.v==='')continue;const key=cell.t==='n'?String(cell.v):String(cell.v).trim();if(!key)continue;if(!cm.has(key)){if(cm.size>=60){ok=false;break;}cm.set(key,cm.size);}}
      if(ok&&cm.size>=1)cats.push({name,c,map:cm,values:[...cm.keys()]});
    }
    cats.sort((a,b)=>{const pa=PRI.indexOf(a.name.toLowerCase()),pb=PRI.indexOf(b.name.toLowerCase());return (pa<0?99:pa)-(pb<0?99:pb);});
    const mkOf=(s)=>{if(typeof s!=='number'||s<20000||s>80000)return null;return new Date(Math.round((s-25569)*86400000)).toISOString().slice(0,7);};
    const mp={},items=[];
    for(const r of rows){
      const p=nP(cs(r.d[PC]))||'(vide)';const o=OEC!==-1?((cs(r.d[OEC])||'').toLowerCase().trim()||'(vide)'):'—';
      const bb=[];cand.forEach((k,i)=>{if(isOn(r.d[k.c]))bb.push(i);});
      const key=p+'|'+o+'|'+bb.join(',');const e2=mp[key]||(mp[key]={p,o,b:bb,n:0,vis:0});e2.n++;
      const vis=VISC!==-1?cn(r.d[VISC]):null;if(vis!==null)e2.vis+=vis;
      const so=SOAC!==-1?cn(r.d[SOAC]):null;
      const eng=SOAC!==-1?(so||0):((LKC!==-1?cn(r.d[LKC])||0:0)+(CMC!==-1?cn(r.d[CMC])||0:0));
      const dcell=DC!==-1?r.d[DC]:null;const d=dcell&&typeof dcell.v==='number'?dcell.v:null;
      const cc=cats.map(k=>{const cell=r.d[k.c];if(!cell||cell.v===undefined||cell.v===null||cell.v==='')return -1;const key=cell.t==='n'?String(cell.v):String(cell.v).trim();const i=k.map.get(key);return i===undefined?-1:i;});
      items.push({er:r.er,p,o,vis,eng,eq:EQC!==-1?(cn(r.d[EQC])||0):0,dep:DEPC!==-1?(cn(r.d[DEPC])||0):0,d,mk:mkOf(d),acc:CC!==-1?cs(r.d[CC]):null,c:cc,url:UC!==-1?cs(r.d[UC]):null,idp:IDPC!==-1?cs(r.d[IDPC]):null,b:bb});
    }

    res.push({sec:'RECAP',id:'recap',st:'i',lb:'Récapitulatif',msg:'',recap:Object.values(mp),brandCols,brandDetected,hasVis:VISC!==-1,rows:[]});
    res.push({sec:'TOPS',id:'tops',st:'i',lb:'Tops',msg:'',items,brandCols,brandDetected,hasSOA:SOAC!==-1,hasVis:VISC!==-1,hasEq:EQC!==-1,hasDep:DEPC!==-1,hasDate:DC!==-1,cats:cats.map(k=>({name:k.name,values:k.values})),b2,rows:[]});

window.__realNames={};

/* Colonnes de marques — gère les deux dispositions :
   ancienne : impression_indiquées … [marques] … detection textuelle ?   ·   actuelle : detection textuelle ? [marques] … commentaire   ·   vMD : detection textuelle ? [marques] jusqu'à la dernière colonne */
function brandHeaders(m){
  const hs=[];for(let c=m._mnC;c<=m._mxC;c++){const hh=m['_h'+c];if(hh)hs.push({c,name:hh,low:hh.toLowerCase().trim()});}
  const nz=(s)=>s.replace(/é/g,'e');
  const ind=hs.find(x=>nz(x.low)==='impression_indiquees'||nz(x.low)==='impression indiquees')||hs.find(x=>/^impression/.test(x.low));
  const det=hs.find(x=>/^d[eé]tection textuelle/.test(x.low));
  if(ind&&det&&det.c>ind.c&&hs.some(x=>x.c>ind.c&&x.c<det.c))return hs.filter(x=>x.c>ind.c&&x.c<det.c);
  const s=det||ind;if(!s)return [];
  const en=hs.find(x=>x.c>s.c&&/^(commentaires?|comments?)$/.test(x.low));
  return hs.filter(x=>x.c>s.c&&(!en||x.c<en.c)&&x!==det&&x!==ind);
}
const colL=(c)=>{let s='';c++;while(c>0){const k=(c-1)%26;s=String.fromCharCode(65+k)+s;c=Math.floor((c-1)/26);}return s;};

async function loadWorkbook(){
  return Excel.run(async(ctx)=>{
    const sheets=ctx.workbook.worksheets;sheets.load('items/name');await ctx.sync();
    const wb={SheetNames:sheets.items.map(s=>s.name),Sheets:{}};
    window.__realNames={};window.__skipped=[];
    const wanted=['data','tableaux','index','commentaires'];
    /* colonnes de texte libre (posts, descriptions…) : inutiles pour les contrôles et très lourdes, on ne les transfère pas (l'en-tête reste lu) */
    const SKIP=new Set(['text','description','author_description','text_with_client_name','agreg_txt_tag_author','tagged_users','coauthor_producers','coauthor','mentions','hashtags','url_media','filename','message','commentaire','engagement_src','src_collecte']);
    const ERR=/^#(N\/A|REF!|VALUE!|DIV\/0!|NAME\?|NULL!|NUM!|SPILL!|CALC!|GETTING_DATA)/;
    for(const sh of sheets.items){
      const low=sh.name.toLowerCase();if(!wanted.includes(low))continue;
      window.__realNames[low.toUpperCase()]=sh.name;
      const ur=sh.getUsedRangeOrNullObject(true);ur.load('rowIndex,columnIndex,rowCount,columnCount,isNullObject');await ctx.sync();
      const ws={};
      if(ur.isNullObject){ws['!ref']='A1:A1';wb.Sheets[sh.name]=ws;continue;}
      const r0=ur.rowIndex,c0=ur.columnIndex,nR=ur.rowCount,nC=ur.columnCount;
      const CL=[];for(let j=0;j<nC;j++)CL[j]=colL(c0+j);
      const mkc=(v)=>{const ty=typeof v;return {v,t:ty==='number'?'n':ty==='boolean'?'b':(ERR.test(v)?'e':'s')};};
      const useGrid=(low==='data'&&nR>1);
      const W=c0+nC,grid=useGrid?new Array(nR):null;if(useGrid){grid.r0=r0;ws['!grid']=grid;}
      const put=(v,key,gi,gc)=>{const cell=mkc(v);if(key)ws[key]=cell;if(grid){const rw=grid[gi]||(grid[gi]=new Array(W).fill(null));rw[gc]=cell;}};
      let keep=[];for(let j=0;j<nC;j++)keep.push(j);
      let from=0;
      if(useGrid){
        const hr=sh.getRangeByIndexes(r0,c0,1,nC);hr.load('values');await ctx.sync();
        const HV=hr.values[0];
        keep=[];
        for(let j=0;j<nC;j++){const v=HV[j];if(v!==''&&v!==null)put(v,CL[j]+(r0+1),0,c0+j);
          const hn=String(v===null?'':v).trim().toLowerCase();
          if(SKIP.has(hn))window.__skipped.push(String(v));else keep.push(j);}
        from=1;
      }
      /* blocs de colonnes contiguës */
      const blocks=[];for(const j of keep){const b=blocks[blocks.length-1];if(b&&b.e===j-1)b.e=j;else blocks.push({s:j,e:j});}
      const chunk=Math.max(1,Math.floor(100000/Math.max(1,keep.length)));
      for(let off=from;off<nR;off+=chunk){
        const n=Math.min(chunk,nR-off);
        const rgs=blocks.map(b=>{const rg=sh.getRangeByIndexes(r0+off,c0+b.s,n,b.e-b.s+1);rg.load('values');return rg;});
        await ctx.sync();
        rgs.forEach((rg,bi)=>{const V=rg.values,bs=blocks[bi].s,w=blocks[bi].e-bs+1;
          for(let i=0;i<n;i++){const row=V[i];for(let j=0;j<w;j++){const v=row[j];if(v===''||v===null)continue;
            if(grid)put(v,'',off+i,c0+bs+j);else ws[CL[bs+j]+(r0+off+i+1)]=mkc(v);}}});
      }
      ws['!ref']=colL(c0)+(r0+1)+':'+colL(c0+nC-1)+(r0+nR);
      wb.Sheets[sh.name]=ws;
    }
    return wb;
  });
}

async function goTo(sec,target){
  const name=window.__realNames[sec==='TOP10'?'DATA':sec];if(!name)return;
  await Excel.run(async(ctx)=>{const ws=ctx.workbook.worksheets.getItem(name);ws.activate();(target.row?ws.getRange(target.row+':'+target.row):ws.getRange(target.addr)).select();await ctx.sync();});
}

// Sélectionne d'un coup toutes les lignes (ou cellules) concernées
async function selectRows(sec,rows){
  const name=window.__realNames[sec==='TOP10'?'DATA':sec];if(!name)return {selected:0,total:0};
  const nums=[...new Set(rows.filter(x=>typeof x==='number'))].sort((a,b)=>a-b);
  const strs=rows.filter(x=>typeof x==='string');
  const parts=[];let s=null,p=null;
  for(const n of nums){if(s===null){s=p=n;}else if(n===p+1){p=n;}else{parts.push(s+':'+p);s=p=n;}}
  if(s!==null)parts.push(s+':'+p);
  parts.push(...strs);
  const keep=[];let len=0;
  for(const x of parts){if(len+x.length+1>7500)break;keep.push(x);len+=x.length+1;}
  await Excel.run(async(ctx)=>{const ws=ctx.workbook.worksheets.getItem(name);ws.activate();ws.getRanges(keep.join(',')).select();await ctx.sync();});
  return {selected:keep.length,total:parts.length};
}

// Masque toutes les lignes de données sauf celles concernées (réversible avec unfilterRows)
function firstDataRow(key){return key==='INDEX'?2:3;}
async function filterRows(sec,rows){
  const key=sec==='TOP10'?'DATA':sec;const name=window.__realNames[key];if(!name)return {shown:0};
  const nums=[...new Set(rows.filter(x=>typeof x==='number'))].sort((a,b)=>a-b);if(!nums.length)return {shown:0};
  const start=firstDataRow(key);
  await Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(name);ws.activate();
    const ur=ws.getUsedRange(true);ur.load('rowIndex,rowCount');await ctx.sync();
    const last=ur.rowIndex+ur.rowCount;
    ws.getRange(start+':'+last).rowHidden=false;
    const keep=new Set(nums);let a=null,n=0;
    for(let r=start;r<=last+1;r++){
      const hide=r<=last&&!keep.has(r);
      if(hide&&a===null)a=r;
      if(!hide&&a!==null){ws.getRange(a+':'+(r-1)).rowHidden=true;a=null;n++;if(n%400===0)await ctx.sync();}
    }
    ws.getRange(nums[0]+':'+nums[0]).select();
    await ctx.sync();
  });
  return {shown:nums.length};
}
async function unfilterRows(sec){
  const key=sec==='TOP10'?'DATA':sec;const name=window.__realNames[key];if(!name)return;
  await Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(name);
    const ur=ws.getUsedRange(true);ur.load('rowIndex,rowCount');await ctx.sync();
    ws.getRange(firstDataRow(key)+':'+(ur.rowIndex+ur.rowCount)).rowHidden=false;
    await ctx.sync();
  });
}

async function dataCtx(ctx){
  const name=window.__realNames['DATA'];const sh=ctx.workbook.worksheets.getItem(name);
  const ur=sh.getUsedRange(true);ur.load('rowIndex,columnIndex,rowCount,columnCount');await ctx.sync();
  const hr=sh.getRangeByIndexes(ur.rowIndex,ur.columnIndex,1,ur.columnCount);hr.load('values');await ctx.sync();
  const cols={};hr.values[0].forEach((hh,i)=>{const k=String(hh).trim().toLowerCase();if(k&&cols[k]===undefined)cols[k]=ur.columnIndex+i;});
  return {sh,cols,last:ur.rowIndex+ur.rowCount-1};
}
const dcol=(d,...ns)=>{for(const n of ns){const k=n.toLowerCase();if(d.cols[k]!==undefined)return d.cols[k];}for(const n of ns){const al=COL_ALIASES[n.toLowerCase()];if(al)for(const a of al){if(d.cols[a]!==undefined)return d.cols[a];}}return -1;};
async function readCol(ctx,d,c,withF){
  const out={v:[],f:[]};
  for(let r=2;r<=d.last;r+=20000){
    const n=Math.min(20000,d.last-r+1);const rg=d.sh.getRangeByIndexes(r,c,n,1);rg.load(withF?'values,formulasR1C1':'values');await ctx.sync();
    for(let i=0;i<n;i++){out.v.push(rg.values[i][0]);if(withF)out.f.push(rg.formulasR1C1[i][0]);}
  }
  return out;
}
const isFormula=(f)=>typeof f==='string'&&f.startsWith('=');

async function fixFormulas(ctx){
  const d=await dataCtx(ctx);const pc=dcol(d,'plateforme'),ic=dcol(d,'id post','id_post');
  const pv=pc!==-1?(await readCol(ctx,d,pc,false)).v:null,iv=ic!==-1?(await readCol(ctx,d,ic,false)).v:null;
  const isData=(i)=>(pv&&String(pv[i]).trim()!=='')||(iv&&String(iv[i]).trim()!=='');
  const names=[['mois'],['jour'],['semestre'],['année','annee'],['rt (tw)','rt(tw)'],['reply (tw)','reply(tw)']];
  let count=0;const skipped=[];
  for(const ns of names){
    const c=dcol(d,...ns);if(c===-1)continue;
    const x=await readCol(ctx,d,c,true);let ref=null;
    for(let i=x.f.length-1;i>=0;i--){if(isFormula(x.f[i])&&isData(i)){ref=x.f[i];break;}}
    if(!ref){skipped.push(ns[0]);continue;}
    let n=0;
    for(let i=0;i<x.v.length;i++){
      if(isData(i)&&(x.v[i]===''||x.v[i]===null)&&(x.f[i]===''||x.f[i]===null)){d.sh.getCell(2+i,c).formulasR1C1=[[ref]];n++;if(n%500===0)await ctx.sync();}
    }
    await ctx.sync();count+=n;
  }
  return {count,note:skipped.length?`Aucune formule de référence pour : ${skipped.join(', ')}.`:''};
}

async function fixCase(ctx){
  const d=await dataCtx(ctx);const c=dcol(d,'owned/paid/earned','owned_paid_earned');
  if(c===-1)return {count:0,note:'Colonne introuvable.'};
  const x=await readCol(ctx,d,c,true);let n=0;
  for(let i=0;i<x.v.length;i++){
    const v=x.v[i];if(typeof v!=='string'||isFormula(x.f[i]))continue;
    const t=v.replace(/[\s ]+/g,' ').trim().toLowerCase();
    if(['owned','paid','earned'].includes(t)&&t!==v){d.sh.getCell(2+i,c).values=[[t]];n++;if(n%500===0)await ctx.sync();}
  }
  await ctx.sync();return {count:n,note:''};
}

async function fixWebMin(ctx){
  const d=await dataCtx(ctx);const pc=dcol(d,'plateforme'),vc=dcol(d,'visibilité','visibilite');
  if(pc===-1||vc===-1)return {count:0,note:'Colonnes introuvables.'};
  const pv=(await readCol(ctx,d,pc,false)).v,x=await readCol(ctx,d,vc,true);let n=0,skipF=0;
  for(let i=0;i<x.v.length;i++){
    if(String(pv[i]).trim().toLowerCase()!=='websites')continue;
    const v=x.v[i];if(typeof v!=='number'||v>=CONFIG.webMin)continue;
    if(isFormula(x.f[i])){skipF++;continue;}
    d.sh.getCell(2+i,vc).values=[[CONFIG.webMin]];n++;if(n%500===0)await ctx.sync();
  }
  await ctx.sync();return {count:n,note:skipF?`${skipF} cellule(s) contiennent une formule et n'ont pas été touchées.`:''};
}

async function fixTrim(ctx){
  const d=await dataCtx(ctx);
  const cols=[['plateforme'],['owned/paid/earned','owned_paid_earned'],['compte ou requête','compte ou requete'],['scope'],['id post','id_post'],['id page','id_page'],['url']];
  let n=0,skipped=0;
  for(const ns of cols){
    const c=dcol(d,...ns);if(c===-1)continue;const x=await readCol(ctx,d,c,true);
    for(let i=0;i<x.v.length;i++){
      const v=x.v[i];if(typeof v!=='string'||isFormula(x.f[i])||!WSRE.test(v))continue;
      const t=v.replace(/^[\s ​]+|[\s ​]+$/g,'');
      if(!t||/^[\d.,\s-]+$/.test(t)){skipped++;continue;} // évite qu'Excel convertisse un texte en nombre
      d.sh.getCell(2+i,c).values=[[t]];n++;if(n%500===0)await ctx.sync();
    }
    await ctx.sync();
  }
  return {count:n,note:skipped?`${skipped} cellule(s) numériques ignorées par sécurité.`:''};
}

async function fixFollowers(ctx){
  const d=await dataCtx(ctx);const pc=dcol(d,'plateforme');
  if(pc===-1)return {count:0,note:'Colonne plateforme introuvable.'};
  const fcols=Object.keys(d.cols).filter(k=>k.includes('followers')).map(k=>d.cols[k]);
  if(!fcols.length)return {count:0,note:'Aucune colonne followers trouvée.'};
  const pv=(await readCol(ctx,d,pc,false)).v;
  const isStory=(i)=>String(pv[i]).trim().toLowerCase()==='story';
  const cols=[];for(const c of fcols)cols.push({c,x:await readCol(ctx,d,c,true)});
  const withF=cols.filter(k=>k.x.f.some(isFormula));
  if(withF.length!==1)return {count:0,note:withF.length?'Plusieurs colonnes followers contiennent des formules : étendez-les à la main.':'Aucune formule followers trouvée à copier.'};
  const t=withF[0];let ref=null;
  for(let i=t.x.f.length-1;i>=0&&!ref;i--){if(isFormula(t.x.f[i])&&isStory(i))ref=t.x.f[i];}
  for(let i=t.x.f.length-1;i>=0&&!ref;i--){if(isFormula(t.x.f[i]))ref=t.x.f[i];}
  const hasVal=(i)=>cols.some(k=>{const v=k.x.v[i];return typeof v==='number'||(typeof v==='string'&&NUMRE.test(v));});
  let n=0;
  for(let i=0;i<t.x.v.length;i++){
    if(!isStory(i)||hasVal(i))continue;
    if((t.x.v[i]===''||t.x.v[i]===null)&&(t.x.f[i]===''||t.x.f[i]===null)){d.sh.getCell(2+i,t.c).formulasR1C1=[[ref]];n++;if(n%500===0)await ctx.sync();}
  }
  await ctx.sync();return {count:n,note:''};
}

/* Export : crée une NOUVELLE feuille (jamais d'écrasement) avec les tableaux de l'onglet Analyse */
async function exportSheetTables(blocks){
  return Excel.run(async ctx=>{
    const wss=ctx.workbook.worksheets;wss.load('items/name');await ctx.sync();
    const names=new Set(wss.items.map(w=>w.name.toLowerCase()));
    let nm='Synthèse Analyse',k=2;while(names.has(nm.toLowerCase()))nm='Synthèse Analyse '+(k++);
    const ws=wss.add(nm);
    const safe=(v)=>(v===null||v===undefined||(typeof v==='number'&&!isFinite(v)))?'':(typeof v==='string'&&/^[=+\-@]/.test(v)?"'"+v:v);
    const NF={i:'# ##0',p:'0.0" %"',q:'0.00" %"',c:'0.00',f:'0.0'};
    let r=0;
    for(const b of blocks){
      const t=ws.getRangeByIndexes(r,0,1,1);t.values=[[safe(b.title)]];t.format.font.bold=true;t.format.font.size=12;r++;
      if(b.lines){for(const l of b.lines){ws.getRangeByIndexes(r,0,1,1).values=[[safe(l)]];r++;}r++;continue;}
      const nc=b.heads.length,hr=ws.getRangeByIndexes(r,0,1,nc);hr.values=[b.heads.map(safe)];hr.format.font.bold=true;hr.format.fill.color='#E2E8F0';r++;
      b.rows.forEach((row,ri)=>{
        ws.getRangeByIndexes(r,0,1,nc).values=[row.map(safe)];
        row.forEach((v,j)=>{const f=b.byRow?(j===0?'s':b.fmts[ri]):b.fmts[j];if(NF[f]&&typeof v==='number')ws.getRangeByIndexes(r,j,1,1).numberFormat=[[NF[f]]];});
        r++;
      });
      if(b.note){ws.getRangeByIndexes(r,0,1,1).values=[[safe(b.note)]];r++;}
      r++;
    }
    ws.getRange('A:A').format.columnWidth=190;
    ws.getRange('B:L').format.columnWidth=95;
    ws.activate();await ctx.sync();
    return nm;
  });
}

/* ═════════ Onglet Analyse ═════════ */
const serialToDate=(s)=>new Date(Math.round((s-25569)*86400000));
const isoToSerial=(iso)=>{if(!iso)return null;const a=iso.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])/86400000+25569;};
const __ML={};
const mkLabel=(mk)=>__ML[mk]||(__ML[mk]=(()=>{const a=mk.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,1)).toLocaleDateString('fr-FR',{month:'short',year:'2-digit',timeZone:'UTC'});})());
const fI=(n)=>Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g,' ');
const fP=(n,d)=>n.toFixed(d===undefined?1:d).replace('.',',');
const pctVar=(a,b)=>b?((a-b)/b*100):null;
const PCOL={a:'#2563eb',b:'#94a3b8',o:'#cbd5e1'};

function agg(rows){
  const o={n:rows.length,vis:0,eng:0,eq:0,dep:0,byP:{},byO:{}};
  for(const x of rows){
    const v=x.vis||0,en=x.eng||0;o.vis+=v;o.eng+=en;o.eq+=x.eq||0;o.dep+=x.dep||0;
    const bp=o.byP[x.p]||(o.byP[x.p]={n:0,vis:0,eng:0,dep:0});bp.n++;bp.vis+=v;bp.eng+=en;bp.dep+=x.dep||0;
    const bo=o.byO[x.o]||(o.byO[x.o]={n:0,vis:0,eng:0,dep:0});bo.n++;bo.vis+=v;bo.eng+=en;bo.dep+=x.dep||0;
  }
  return o;
}
const metricVal=(x,k)=>k==='n'?1:(x[k]||0);
function monthSeries(rows,k){
  const m={};for(const x of rows){if(!x.mk)continue;m[x.mk]=(m[x.mk]||0)+metricVal(x,k);}
  return Object.keys(m).sort().map(mk=>({mk,v:m[mk]}));
}
function notable(series){
  if(series.length<4)return [];
  const s=series.map(x=>x.v).sort((a,b)=>a-b),med=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;
  if(med<=0)return [];
  return series.filter(x=>x.v>1.5*med||x.v<0.5*med).map(x=>({mk:x.mk,v:x.v,ratio:x.v/med,hi:x.v>med}));
}
function conc(rows,k){
  const arr=rows.map(x=>({x,v:x[k]||0})).filter(a=>a.v>0).sort((a,b)=>b.v-a.v);
  const tot=arr.reduce((a,b)=>a+b.v,0);if(!tot)return null;
  const share=(n)=>arr.slice(0,n).reduce((a,b)=>a+b.v,0)/tot*100;
  let cum=0,k50=0;for(const a of arr){cum+=a.v;k50++;if(cum>=tot/2)break;}
  return {tot,n:arr.length,s1:share(1),s5:share(5),s10:share(10),k50,k50pct:k50/arr.length*100,top:arr.slice(0,5)};
}
const copyText=(txt,done)=>{
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done(ok);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>done(true),fb);else fb();
};

function buildInsights(A,B,labA,labB,rowsA,hasDep,series){
  const ins=[];const cmp=!!B;
  const sg=(v)=>v===null?'':(v>=0?'+':'−')+fP(Math.abs(v))+' %';
  ins.push(`${labA} : ${fI(A.n)} posts et ${fI(A.vis)} de visibilité`+(cmp&&pctVar(A.vis,B.vis)!==null?` (${sg(pctVar(A.vis,B.vis))} vs ${labB})`:'')+'.');
  const pls=Object.entries(A.byP).sort((a,b)=>b[1].vis-a[1].vis);
  if(pls.length&&A.vis>0){
    const [pl,v]=pls[0];const sh=v.vis/A.vis*100;let t=`${pl} concentre ${fP(sh,0)} % de la visibilité`;
    if(cmp&&B.vis>0){const shB=((B.byP[pl]||{vis:0}).vis)/B.vis*100;t+=` (${shB<=sh?'+':'−'}${fP(Math.abs(sh-shB))} pt vs ${labB})`;}
    ins.push(t+'.');
  }
  if(cmp){
    const keys=[...new Set([...Object.keys(A.byP),...Object.keys(B.byP)])];
    const dv=keys.map(k=>({k,d:((A.byP[k]||{vis:0}).vis)-((B.byP[k]||{vis:0}).vis),b:(B.byP[k]||{vis:0}).vis})).filter(x=>x.d!==0);
    const up=[...dv].sort((a,b)=>b.d-a.d)[0],dn=[...dv].sort((a,b)=>a.d-b.d)[0];
    if(up&&up.d>0)ins.push(`Plus forte hausse de visibilité : ${up.k} (+${fI(up.d)}${up.b?`, ${sg(up.d/up.b*100)}`:''}).`);
    if(dn&&dn.d<0)ins.push(`Plus forte baisse de visibilité : ${dn.k} (−${fI(-dn.d)}${dn.b?`, ${sg(dn.d/dn.b*100)}`:''}).`);
  }
  if(A.vis>0){
    const r=A.eng/A.vis*100;let t=`Engagement : ${fI(A.eng)}, soit ${fP(r,2)} % de la visibilité`;
    if(cmp&&B.vis>0){const rB=B.eng/B.vis*100;t+=` (${r>=rB?'+':'−'}${fP(Math.abs(r-rB),2)} pt vs ${labB})`;}
    ins.push(t+'.');
  }
  const pd=A.byO.paid;
  if(pd&&A.n>0){let t=`Le paid représente ${fP(pd.n/A.n*100,0)} % des posts et ${fP(A.vis?pd.vis/A.vis*100:0,0)} % de la visibilité`;if(hasDep&&A.dep>0)t+=`, pour ${fI(A.dep)} de dépenses`;ins.push(t+'.');}
  const c=conc(rowsA,'vis');
  if(c&&c.n>=5)ins.push(`Les 5 premiers posts font ${fP(c.s5,0)} % de la visibilité ; la moitié vient de ${c.k50} post${c.k50>1?'s':''} (${fP(c.k50pct,0)} % des posts).`);
  if(series.length>=3){const mx=[...series].sort((a,b)=>b.v-a.v)[0];ins.push(`Mois le plus fort : ${mkLabel(mx.mk)} (${fI(mx.v)} de visibilité).`);}
  return ins;
}

function Delta(p){
  const {a,b,kind}=p;if(b===null||b===undefined)return null;
  if(kind==='pts'){const d=a-b;return h('span',{style:{color:d>=0?'#15803d':'#b91c1c',fontWeight:700}},(d>=0?'▲ ':'▼ ')+fP(Math.abs(d),2)+' pt');}
  const pc=pctVar(a,b);if(pc===null)return h('span',{style:{color:'#94a3b8'}},'—');
  const col=kind==='cost'?'#475569':(pc>=0?'#15803d':'#b91c1c');
  return h('span',{style:{color:col,fontWeight:700}},(pc>=0?'▲ ':'▼ ')+fP(Math.abs(pc))+' %');
}

function MonthChart(p){
  const {series,aSet,bSet,metric}=p;if(!series.length)return h('div',{style:{color:'#64748b',fontSize:'.76rem'}},'Aucune date exploitable pour tracer une évolution.');
  const W=320,H=140,pl=6,pr=6,pt=14,pb=26,n=series.length,mx=Math.max(...series.map(s=>s.v))||1,bw=(W-pl-pr)/n,step=Math.ceil(n/8);
  const els=[];
  series.forEach((s,i)=>{
    const bh=(H-pt-pb)*s.v/mx,x=pl+i*bw,y=H-pb-bh;
    const col=aSet.has(s.mk)?PCOL.a:bSet.has(s.mk)?PCOL.b:PCOL.o;
    els.push(h('rect',{key:'r'+i,x:x+1,y,width:Math.max(1,bw-2),height:Math.max(0,bh),fill:col,rx:1},h('title',null,mkLabel(s.mk)+' : '+fI(s.v))));
    if(i%step===0)els.push(h('text',{key:'t'+i,x:x+bw/2,y:H-pb+11,fontSize:8,textAnchor:'middle',fill:'#64748b'},mkLabel(s.mk)));
  });
  els.push(h('text',{key:'mx',x:pl,y:9,fontSize:8,fill:'#64748b'},'max '+fI(mx)));
  return h('svg',{viewBox:'0 0 '+W+' '+H,width:'100%',style:{display:'block'}},els);
}

function AnalyseTab(p){
  const {tops,brand,onBrand,onToast}=p;
  const [mode,setMode]=useState('col');
  const [col,setCol]=useState('');
  const [va,setVa]=useState('');
  const [vb,setVb]=useState('');
  const [da1,setDa1]=useState('');
  const [da2,setDa2]=useState('');
  const [db1,setDb1]=useState('');
  const [db2,setDb2]=useState('');
  const [metric,setMetric]=useState('vis');
  const [openT,setOpenT]=useState(new Set());
  const [dim,setDim]=useState('p');
  const [gmet,setGmet]=useState('vis');
  const [stack,setStack]=useState(false);
  const inited=useRef(false);
  useEffect(()=>{
    if(!tops||inited.current)return;inited.current=true;
    const names=tops.cats.map(c=>c.name);const sc=names.find(n=>n.toLowerCase()==='scope');const ini=sc||names[0]||'';
    setCol(ini);const cat=tops.cats.find(c=>c.name===ini);

/* valeurs actuelles de la colonne cible, pour les lignes demandées */
async function readTarget(sheet,col,rows){
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(sheet);const rs=[...rows].sort((a,b)=>a-b),map=new Map();
    let i=0;
    while(i<rs.length){let j=i;while(j+1<rs.length&&rs[j+1]-rs[j]<=500&&rs[j+1]-rs[i]<20000)j++;
      const n=rs[j]-rs[i]+1,rg=ws.getRangeByIndexes(rs[i],col,n,1);rg.load('values,formulasR1C1');await ctx.sync();
      for(let k=i;k<=j;k++){const o=rs[k]-rs[i];map.set(rs[k],{v:rg.values[o][0],f:rg.formulasR1C1[o][0]});}
      i=j+1;}
    return map;
  });

const isEmptyV=(v)=>v===''||v===null||v===undefined;
const isF=(f)=>typeof f==='string'&&f.charAt(0)==='=';
/* écriture sécurisée : on relit chaque cellule juste avant d'écrire et on ne touche pas à ce qui a changé */
async function writeChanges(sheet,changes,onProg,collect){
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(sheet);let n=0,skipped=0;
    for(let i=0;i<changes.length;i+=500){
      const part=changes.slice(i,i+500);
      const cells=part.map(ch=>{const c=ws.getCell(ch.r,ch.c);c.load('values,formulasR1C1');return c;});
      await ctx.sync();
      part.forEach((ch,k)=>{
        const cur=cells[k].values[0][0],f=cells[k].formulasR1C1[0][0];
        const ok=!isF(f)&&(ch.expect==='empty'?isEmptyV(cur):ch.expect==='any'?true:cur===ch.before);
        if(!ok){skipped++;return;}
        if(ch.fmt)cells[k].numberFormat=[[ch.fmt]];
        if(collect)collect.push({r:ch.r,c:ch.c,old:cur,nw:ch.formula||ch.v,isF:!!ch.formula});if(ch.formula)cells[k].formulas=[[ch.formula]];else cells[k].values=[[ch.v]];n++;
      });
      await ctx.sync();
      if(onProg)onProg(Math.min(i+500,changes.length),changes.length);
    }
    return {n,skipped};
  });
}

async function planIds(sel,o){
  const ign={'cellules sans URL':0,'formules ignorées':0};const ch=[],bad=[];let exists=0;
  const urls=[];
  for(const c of sel.cells){
    if(isF(c.f)){ign['formules ignorées']++;continue;}
    if(typeof c.v!=='string'||!looksUrl(c.v)){ign['cellules sans URL']++;continue;}
    urls.push(c);
  }
  let tmap=null;
  if(o.mode==='fill'){
    if(o.tcol==null)throw new Error('Choisissez la colonne à remplir.');
    if(o.colsSheet!==sel.sheet)throw new Error("La sélection est sur la feuille « "+sel.sheet+" » mais les colonnes proposées viennent de « "+o.colsSheet+" » : cliquez sur « Relire les colonnes ».");
    if(urls.some(c=>c.c===o.tcol))throw new Error('La colonne à remplir contient des URLs sélectionnées : choisissez une autre colonne, ou le mode « Remplacer dans la cellule ».');
    tmap=await readTarget(sel.sheet,o.tcol,new Set(urls.map(c=>c.r)));
  }
  const rowSeen=new Set();
  for(const c of urls){
    const x=extractId(c.v);
    if(x.st!=='ok'){bad.push({r:c.r,pl:x.pl,v:c.v});continue;}
    if(o.mode==='fill'){
      const t=tmap.get(c.r);
      if(rowSeen.has(c.r)){ign['2e URL sur une même ligne']=(ign['2e URL sur une même ligne']||0)+1;continue;}
      rowSeen.add(c.r);
      if(t&&(!isEmptyV(t.v)||isF(t.f))){exists++;continue;}
      ch.push({r:c.r,c:o.tcol,v:x.id,fmt:'@',expect:'empty',before:c.v,pl:x.pl});
    }else{
      if(x.id===c.v)continue;
      ch.push({r:c.r,c:c.c,v:x.id,fmt:'@',expect:'same',before:c.v,pl:x.pl});
    }
  }
  if(exists)ign['ID déjà rempli (non touché)']=exists;
  return {changes:ch,ign,bad,sheet:sel.sheet,truncated:sel.truncated,byPl:ch.reduce((m,x)=>{m[x.pl]=(m[x.pl]||0)+1;return m;},{})};
}

const ApifyN=(function(){
// Normaliseur d'exports Apify -> structure commune.
// Entrée : tableau de lignes (JSON imbriqué OU lignes déjà aplaties de CSV/XLSX, clés "a/b/0").
// Sortie : { platform, records[], skipped[], stats }
// Aucune dépendance : fonctionne dans le volet Excel (navigateur) et sous Node.

'use strict';

// ---------- Aplatissement : JSON imbriqué et colonnes CSV/XLSX -> mêmes chemins "a.b.0" ----------
function flatten(obj, prefix = '', out = {}) {
  if (obj === null || obj === undefined) { if (prefix) out[prefix] = null; return out; }
  if (Array.isArray(obj)) {
    obj.forEach((v, i) => flatten(v, prefix ? `${prefix}.${i}` : String(i), out));
    return out;
  }
  if (typeof obj === 'object') {
    for (const [k, v] of Object.entries(obj)) flatten(v, prefix ? `${prefix}.${k}` : k, out);
    return out;
  }
  out[prefix] = obj;
  return out;
}

function normalizeRow(row) {
  // Les colonnes CSV/XLSX d'Apify utilisent "/" comme séparateur : on les ramène à ".".
  const needsFlatten = Object.values(row).some(v => v !== null && typeof v === 'object');
  const flat = needsFlatten ? flatten(row) : { ...row };
  const out = {};
  for (const [k, v] of Object.entries(flat)) out[k.replace(/\//g, '.')] = v;
  return out;
}

// ---------- Utilitaires ----------
function pick(r, paths) {
  for (const p of paths) {
    const v = r[p];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return null;
}

// Nombre robuste : 1234, "1234", "1 234", "1,2K", "3.4M", "1 234,5"
function toNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v).trim().replace(/ |\s/g, '').toLowerCase();
  if (s === '' || s === 'none' || s === 'null' || s === 'nan') return null;
  const m = s.match(/^(-?[\d.,]+)([kmb])?$/);
  if (!m) return null;
  let n = m[1];
  if (n.includes(',') && n.includes('.')) n = n.replace(/,/g, '');
  else n = n.replace(',', '.');
  let x = parseFloat(n);
  if (!Number.isFinite(x)) return null;
  const mult = { k: 1e3, m: 1e6, b: 1e9 }[m[2]] || 1;
  return Math.round(x * mult);
}

// Les identifiants restent du texte (jamais de Number : 19 chiffres dépassent la précision JS).
function toId(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return String(v); // déjà perdu si > 2^53 : à éviter en amont
  const s = String(v).trim();
  return /^none|null|nan$/i.test(s) ? null : s;
}

function toDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number' || /^\d{9,10}$/.test(String(v))) return new Date(Number(v) * 1000).toISOString();
  const d = new Date(String(v));
  return isNaN(d) ? null : d.toISOString();
}

const hostOf = (s) => { const m = /^(?:[a-z][a-z0-9+.-]*:\/\/)?([^\/?#\s]+)/i.exec(String(s).trim()); return m ? m[1].toLowerCase().replace(/^(www|m|mobile|web|mbasic)\./, '') : ''; };

  if (/(^|\.)youtube\.com$|^youtu\.be$|(^|\.)youtube-nocookie\.com$/.test(h0)) return 'youtube';

};
const cut19 = (id) => id.length > 19 ? id.slice(-19) : id;
const bare = (s) => String(s).trim().split(/[?#]/)[0].replace(/\/+$/, '');
const ID_RULES = {
  facebook: (s) => {

  const delim=(cnt(';')>cnt(',')&&cnt(';')>=cnt('\t'))?';':(cnt('\t')>cnt(',')?'\t':',');
  const rows=[];let row=[],f='',q=false,i=0;const n=text.length;
  while(i<n){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===delim){row.push(f);f='';i++;continue;}
    if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];i++;continue;}
    f+=c;i++;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  if(!rows.length)return [];
  const hdr=rows[0].map(x=>String(x).trim()),out=[];
  for(let r=1;r<rows.length;r++){const rw=rows[r];if(rw.length===1&&rw[0]==='')continue;const o={};for(let j=0;j<hdr.length;j++){const v=rw[j];o[hdr[j]]=(v===undefined||v==='')?null:v;}out.push(o);}
  return out;
}
async function readExportFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase(),warn=[];
  if(ext==='json'){
    const t=await file.text();let d=JSON.parse(t.replace(/^﻿/,''));
    if(!Array.isArray(d)){const k=d&&typeof d==='object'?Object.keys(d).find(x=>Array.isArray(d[x])):null;d=k?d[k]:null;}
    if(!d)throw new Error('JSON : tableau de lignes introuvable.');
    return {rows:d,warn};
  }
  if(ext==='csv'||ext==='txt'){
    const buf=await file.arrayBuffer();let t;
    try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){t=new TextDecoder('windows-1252').decode(buf);}
    return {rows:parseCSV(t),warn};
  }
  if(ext==='xlsx'||ext==='xls'||ext==='xlsm'){
    if(typeof XLSX==='undefined')throw new Error('Lecteur Excel indisponible (réseau) : réexportez ce fichier en CSV ou JSON.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});
    const bigNum=rows.slice(0,300).some(r=>['id','postId','facebookId','conversationId'].some(k=>typeof r[k]==='number'&&r[k]>=1e15));
    if(bigNum)warn.push('Identifiants stockés comme nombres dans ce fichier : ils ont pu être tronqués (15 chiffres). Préférez le fichier brut d\'Apify ou un export CSV/JSON.');
    return {rows,warn};
  }
  throw new Error('Format non pris en charge (.'+ext+').');
}

/* ── lecture du pivot (colonnes utiles uniquement) ── */
async function loadPivotForUpdate(scope,sheetName){
  const pv=await Excel.run(async(ctx)=>{
    const wl=ctx.workbook.worksheets;wl.load('items/name');await ctx.sync();
    const nm=sheetName||(window.__realNames&&window.__realNames.DATA)||(wl.items.find(s=>s.name.trim().toLowerCase()==='data')||{}).name;
    if(!nm)throw new Error('Onglet DATA introuvable dans ce classeur : utilisez le mode « Autre fichier ».');
    const sh=ctx.workbook.worksheets.getItem(nm);
    const ur=sh.getUsedRange(true);ur.load('rowIndex,columnIndex,rowCount,columnCount');await ctx.sync();
    const hr=sh.getRangeByIndexes(ur.rowIndex,ur.columnIndex,1,ur.columnCount);hr.load('values');await ctx.sync();
    const headers=hr.values[0].map(v=>String(v==null?'':v).trim());
    const P=PivotUpd.detectPivotFormat(headers);
    if(!P)throw new Error('Format du pivot non reconnu : colonnes « ID post / Plateforme » ou « Post_id / social_media » introuvables. S\'il ne s\'agit pas d\'un pivot, utilisez le mode « Autre fichier ».');
    const idx={};headers.forEach((hh,i)=>{const k=hh.toLowerCase();if(k&&idx[k]===undefined)idx[k]=ur.columnIndex+i;});
    const need=[P.platform,P.id,P.url,P.engagement,P.visibility,...Object.values(P.metrics),...Object.values(P.viewsByPlatform||{})];
    const cidx={},miss=[];
    need.forEach(nme=>{const c=idx[nme.trim().toLowerCase()];if(c===undefined)miss.push(nme.trim());else cidx[nme]=c;});
    if(miss.length)throw new Error('Colonne(s) introuvable(s) dans DATA : '+[...new Set(miss)].join(', '));
    const firstIdx=2,lastIdx=ur.rowIndex+ur.rowCount-1;   // la ligne Excel 3 est la 1re ligne de données (la 2 est le modèle)
    const names=Object.keys(cidx),rows=[];
    for(let r0=firstIdx;r0<=lastIdx;r0+=20000){
      const n=Math.min(20000,lastIdx-r0+1);
      const rgs=names.map(nm2=>{const rg=sh.getRangeByIndexes(r0,cidx[nm2],n,1);rg.load('values');return rg;});
      await ctx.sync();
      for(let i=0;i<n;i++){const o={row:r0+i+1};for(let k=0;k<names.length;k++){const v=rgs[k].values[i][0];o[names[k]]=v===''?null:v;}rows.push(o);}
    }
    let scopeSet=null;
    if(scope==='visible'&&lastIdx>=firstIdx){
      const rg=sh.getRangeByIndexes(firstIdx,cidx[P.platform],lastIdx-firstIdx+1,1);
      const vis=rg.getSpecialCellsOrNullObject(Excel.SpecialCellType.visible);vis.load('isNullObject');await ctx.sync();
      if(!vis.isNullObject){
        vis.areas.load('items/rowIndex,items/rowCount');await ctx.sync();
        const tot=vis.areas.items.reduce((a,x)=>a+x.rowCount,0);
        if(tot<lastIdx-firstIdx+1){scopeSet=new Set();vis.areas.items.forEach(a=>{for(let k=0;k<a.rowCount;k++)scopeSet.add(a.rowIndex+k+1);});}
      }
    }
    // colonnes ajoutées : réutilisées si elles existent déjà, sinon à la suite de la dernière colonne
    let next=ur.columnIndex+ur.columnCount;const newCols={};
    MAJ_COLS.forEach(([k,label])=>{const c=idx[label.toLowerCase()];if(c!==undefined)newCols[k]={c,name:label,exists:true};else newCols[k]={c:next++,name:label,exists:false};});
    const hdr={};headers.forEach((hh,i)=>{hdr[ur.columnIndex+i]=hh;});MAJ_COLS.forEach(([k,label])=>{hdr[newCols[k].c]=label;});
    return {sheet:nm,P,rows,scope:scopeSet,cidx,newCols,headerRow:ur.rowIndex,firstIdx,lastIdx,hdr};
  });
  if(scope==='selection')await applySelectionScope(pv);
  return pv;
}

async function loadGenericForUpdate(scope,gi,map){
  const metricKeys=['likes','comments','shares','retweets','quotes','saves','views'].filter(k=>map[k]!=null);

  const mapped=GEN_FIELDS.map(x=>x[0]).filter(k=>map[k]!=null);
  const pv=await Excel.run(async(ctx)=>{
    const sh=ctx.workbook.worksheets.getItem(gi.sheet);
    const ur=sh.getUsedRange(true);ur.load('rowIndex,columnIndex,rowCount,columnCount');await ctx.sync();
    const firstIdx=gi.headerRow+1,lastIdx=ur.rowIndex+ur.rowCount-1;
    const rows=[];let unknown=0,bigIds=0;
    for(let r0=firstIdx;r0<=lastIdx;r0+=20000){

      const rgs=mapped.map(k=>{const rg=sh.getRangeByIndexes(r0,map[k],n,1);rg.load('values');return rg;});
      await ctx.sync();
      for(let i=0;i<n;i++){

        const url=g.url!=null?String(g.url).trim():'';

          else{id=String(g.id).trim();if(/^https?:\/\//i.test(id))id=idOnly(id)||'';}
        }
        if(!id&&url)id=idOnly(url)||'';

        let plat=g.platform!=null?normPlatCell(g.platform):'';
        if(!plat){const pu=platOfUrl(url||(g.id!=null&&/^https?:/i.test(String(g.id))?String(g.id):''));plat=['facebook','instagram','twitter','youtube','tiktok'].indexOf(pu)>=0?pu:'';}

        if(tot<lastIdx-firstIdx+1){scopeSet=new Set();vis.areas.items.forEach(a=>{for(let k=0;k<a.rowCount;k++)scopeSet.add(a.rowIndex+k+1);});}

    const hdr={};gi.cols.forEach(x=>{hdr[x.c]=x.name;});MAJ_COLS.forEach(([k,label])=>{hdr[newCols[k].c]=label;});

const baisseList=(l)=>l.flags.filter(f=>f.indexOf('baisse_')===0).map(f=>f.slice(7)).join(', ');
function statusText(l,date){
  switch(l.status){
    case 'mis_a_jour':return 'Mis à jour '+date;
    case 'mis_a_jour_avec_baisse':return 'Mis à jour '+date+' · baisse ignorée ('+baisseList(l)+')';
    case 'baisse_signalee':return 'Baisse ignorée '+date+' ('+baisseList(l)+')';
    case 'inchange':return 'Inchangé '+date;
    default:return 'Non trouvé dans l\'export '+date;
  }

function buildWrites(pv,res,opts){
  const track=!opts||opts.track!==false;
  const P=pv.P,nc=pv.newCols,date=todayStr(),w=[],cnt={metricCells:0,rowsTouched:0,statuts:0};
  const engC=pv.cidx[P.engagement],visC=pv.cidx[P.visibility];     // absentes en mode « autre fichier » si non choisies
  const engL=engC===undefined?null:colL(engC),visL=visC===undefined?null:colL(visC);
  const aeL=colL(nc.eng.c),avL=colL(nc.vis.c);
  if(track&&res.lines.length)MAJ_COLS.forEach(([k])=>{if(!nc[k].exists)w.push({r:pv.headerRow,c:nc[k].c,v:nc[k].name,expect:'empty'});});
  for(const l of res.lines){
    const r0=l.row-1,xr=l.row;
    for(const m of Object.keys(l.changes)){
      const ch=l.changes[m];if(ch.kind!=='fill'&&ch.kind!=='raise')continue;
      w.push({r:r0,c:pv.cidx[ch.column],v:ch.new,expect:ch.kind==='fill'?'empty':'eq',before:ch.old});cnt.metricCells++;
    }
    if(Object.values(l.changes).some(c=>c.kind==='fill'||c.kind==='raise'))cnt.rowsTouched++;
    if(!track)continue;
    w.push({r:r0,c:nc.st.c,v:statusText(l,date),expect:'any'});cnt.statuts++;
    if(l.status!=='non_trouve'){
      if(l.engagement&&l.engagement.old!==null)w.push({r:r0,c:nc.eng.c,v:l.engagement.old,expect:'any'});
      const visOld=(visL!==null)?l.visibilityOld:l.views.old;
      if(visOld!==null&&visOld!==undefined)w.push({r:r0,c:nc.vis.c,v:visOld,expect:'any'});
      if(engL!==null)w.push({r:r0,c:nc.deng.c,formula:`=IF(ISNUMBER(${engL}${xr}),${engL}${xr},0)-IF(ISNUMBER(${aeL}${xr}),${aeL}${xr},0)`,expect:'any'});
      else w.push({r:r0,c:nc.deng.c,v:l.engagement.delta,expect:'any'});
      if(visL!==null)w.push({r:r0,c:nc.dvis.c,formula:`=IF(ISNUMBER(${visL}${xr}),${visL}${xr},0)-IF(ISNUMBER(${avL}${xr}),${avL}${xr},0)`,expect:'any'});
      else w.push({r:r0,c:nc.dvis.c,v:l.views.delta,expect:'any'});
    }
  }
  return {writes:w,counts:cnt};
}

async function withManualCalc(fn){

}

async function detectTarget(sheetName,force){
  let act=null;
  try{act=await readSheetCols(sheetName);}catch(e){if(sheetName)throw e;}
  const mk=(g,kind)=>{
    if(kind==='pivot'){const P=PivotUpd.detectPivotFormat(g.cols.map(x=>x.name));if(!P)throw new Error('La feuille « '+g.sheet+' » n\'a pas la structure d\'un pivot.');return {kind:'pivot',sheet:g.sheet,sheets:g.sheets,cols:g.cols,P,gi:g};}
    return {kind:'generic',sheet:g.sheet,sheets:g.sheets,cols:g.cols,gi:g,gmap:autoMap(g.cols)};
  };
  if(act){
    if(force==='generic')return mk(act,'generic');
    if(force==='pivot')return mk(act,'pivot');
    if(PivotUpd.detectPivotFormat(act.cols.map(x=>x.name)))return mk(act,'pivot');
  }
  if(!sheetName){
    const names=(act&&act.sheets)||await Excel.run(async(ctx)=>{const wl=ctx.workbook.worksheets;wl.load('items/name');await ctx.sync();return wl.items.map(x=>x.name);});
    const dn=names.find(x=>x.trim().toLowerCase()==='data');
    if(dn&&(!act||dn!==act.sheet)){const d=await readSheetCols(dn);if(PivotUpd.detectPivotFormat(d.cols.map(x=>x.name))){d.sheets=names;return mk(d,'pivot');}}
  }
  if(!act)throw new Error('Aucune feuille exploitable : ouvrez le fichier à mettre à jour dans Excel.');
  return mk(act,'generic');
}
function keyColOf(t){

  if(t.kind==='pivot'){const k=t.P.platform.trim().toLowerCase();const c=t.cols.find(x=>x.name.toLowerCase()===k);return c?c.c:null;}
  const m=t.gmap||{};return m.id!=null?m.id:(m.url!=null?m.url:null);
}
async function countScopes(sheet,keyCol,firstIdx){
  const sel=await getSel();
  return Excel.run(async(ctx)=>{
    const sh=ctx.workbook.worksheets.getItem(sheet);
    const ur=sh.getUsedRange(true);ur.load('rowIndex,rowCount');await ctx.sync();
    const lastIdx=ur.rowIndex+ur.rowCount-1;
    if(lastIdx<firstIdx)return {all:0,visible:0,selection:0};
    const filled=new Uint8Array(lastIdx-firstIdx+1);
    for(let r0=firstIdx;r0<=lastIdx;r0+=20000){
      const n=Math.min(20000,lastIdx-r0+1),rg=sh.getRangeByIndexes(r0,keyCol,n,1);rg.load('values');await ctx.sync();
      for(let i=0;i<n;i++){const v=rg.values[i][0];if(v!==''&&v!==null)filled[r0-firstIdx+i]=1;}
    }
    let all=0;for(let i=0;i<filled.length;i++)all+=filled[i];
    let visible=all;
    const rg=sh.getRangeByIndexes(firstIdx,keyCol,lastIdx-firstIdx+1,1);
    const vis=rg.getSpecialCellsOrNullObject(Excel.SpecialCellType.visible);vis.load('isNullObject');await ctx.sync();
    if(!vis.isNullObject){
      vis.areas.load('items/rowIndex,items/rowCount');await ctx.sync();visible=0;
      for(const a of vis.areas.items)for(let k=0;k<a.rowCount;k++){const i=a.rowIndex+k-firstIdx;if(i>=0&&i<filled.length&&filled[i])visible++;}
    }
    const seen=new Set();
    if(sel.sheet===sheet)for(const a of sel.areas)for(let k=0;k<a.rowCount;k++){const i=a.rowIndex+k-firstIdx;if(i>=0&&i<filled.length&&filled[i])seen.add(i);}
    return {all,visible,selection:seen.size,selSheet:sel.sheet};
  });
}

/* journal : feuille visible « log_xt_tmf ». Par mise à jour : 1 ligne « Résumé » + 1 ligne « Ligne » par ligne du pivot modifiée */
const rangesOf=(rows,max)=>{
  const a=[...new Set(rows)].sort((x,y)=>x-y),out=[];let i=0;
  while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;out.push(a[i]===a[j]?String(a[i]):a[i]+'–'+a[j]);i=j+1;}
  const m=max||6;return out.length>m?out.slice(0,m).join(', ')+' … ('+out.length+' plages)':out.join(', ');
};
async function openLog(ctx){
  let ws=ctx.workbook.worksheets.getItemOrNullObject(LOG_SHEET);ws.load('isNullObject');await ctx.sync();
  if(ws.isNullObject){
    ws=ctx.workbook.worksheets.add(LOG_SHEET);
    ws.getRange('A1:I1').values=[LOG_HDR];ws.getRange('A1:I1').format.font.bold=true;
    ws.getRange('G:H').numberFormat='@';ws.freezePanes.freezeRows(1);await ctx.sync();
  }
  return ws;
}
async function appendLog(sheetName,lot,cells,hdr,meta){
  if(!cells.length)return;
  const byRow=new Map();cells.forEach(x=>{if(!byRow.has(x.r))byRow.set(x.r,[]);byRow.get(x.r).push(x);});
  const rowsSorted=[...byRow.keys()].sort((x,y)=>x-y);
  const tool=(meta&&meta.tool)||'Mise à jour Apify';
  const out=[[lot,lot,'Résumé',tool,sheetName,'',(meta&&meta.summary)||(rowsSorted.length+' lignes, '+cells.length+' cellules'),'','']];
  const show=(v)=>(v===''||v==null)?'vide':String(v);
  for(const r of rowsSorted){
    const it=byRow.get(r);
    const txt=it.map(x=>(hdr[x.c]||colL(x.c))+' '+show(x.old)+'→'+(x.isF?'formule':show(x.nw))).join(' · ');
    const js=JSON.stringify(it.map(x=>[x.c,(x.old===''||x.old==null)?null:x.old,x.nw,x.isF?1:0]));
    out.push([lot,lot,'Ligne',tool,sheetName,r+1,txt.slice(0,900),js,'']);
  }
  await Excel.run(async(ctx)=>{
    const ws=await openLog(ctx);
    const ur=ws.getUsedRangeOrNullObject(true);ur.load('rowCount,isNullObject');await ctx.sync();
    const start=ur.isNullObject?1:ur.rowCount;
    for(let i=0;i<out.length;i+=5000){
      const part=out.slice(i,i+5000);
      ws.getRangeByIndexes(start+i,6,part.length,2).numberFormat='@';
      ws.getRangeByIndexes(start+i,0,part.length,9).values=part;await ctx.sync();
    }
  });
  LOGBUS.bump();
}
async function readLastBatch(){
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItemOrNullObject(LOG_SHEET);ws.load('isNullObject');await ctx.sync();
    if(ws.isNullObject)return null;
    const ur=ws.getUsedRangeOrNullObject(true);ur.load('rowCount,isNullObject');await ctx.sync();
    if(ur.isNullObject||ur.rowCount<2)return null;
    const N=ur.rowCount,A=[],C=[],D=[],E=[],G=[],H=[],I=[];
    for(let r0=1;r0<N;r0+=20000){
      const n=Math.min(20000,N-r0),rg=ws.getRangeByIndexes(r0,0,n,9);rg.load('values');await ctx.sync();
      for(const v of rg.values){A.push(v[0]);C.push(v[2]);D.push(v[3]);E.push(v[4]);G.push(v[6]);H.push(v[7]);I.push(v[8]);}
    }
    let lots=0,last=-1;
    for(let i=0;i<C.length;i++)if(C[i]==='Résumé'){lots++;if(I[i]===''&&H[i]!=='purgé')last=i;}
    if(last<0)return {lot:null,lots};
    let n=0;for(let i=last+1;i<C.length&&C[i]==='Ligne'&&A[i]===A[last];i++)n++;
    return {lot:String(A[last]),rows:n,tool:String(D[last]),sheet:String(E[last]),text:String(G[last]),lots};
  });
}
async function undoBatch(lot,onProg){
  return withManualCalc(()=>Excel.run(async(ctx)=>{
    const lw=ctx.workbook.worksheets.getItem(LOG_SHEET);
    const ur=lw.getUsedRange(true);ur.load('rowCount');await ctx.sync();
    const N=ur.rowCount,all=[];
    for(let r0=1;r0<N;r0+=20000){
      const n=Math.min(20000,N-r0),rg=lw.getRangeByIndexes(r0,0,n,9);rg.load('values');await ctx.sync();
      rg.values.forEach((v,i)=>all.push({li:r0+i,v}));
    }
    let s=-1;for(let i=all.length-1;i>=0;i--){if(String(all[i].v[0])===lot&&all[i].v[2]==='Résumé'){s=i;break;}}
    if(s<0)throw new Error('Lot introuvable dans le journal.');
    const det=[];for(let i=s+1;i<all.length&&all[i].v[2]==='Ligne'&&String(all[i].v[0])===lot;i++)det.push(all[i]);
    const items=[];
    det.forEach((d,di)=>{let arr=[];try{arr=JSON.parse(d.v[7]);}catch(e){}arr.forEach(([c,old,nw,isF])=>items.push({di,sheet:String(d.v[4]),row:+d.v[5],col:c,old,nw,isF:!!isF}));});
    let restored=0,skipped=0;const okByRow=det.map(()=>0),koByRow=det.map(()=>0);
    for(let i=0;i<items.length;i+=500){
      const part=items.slice(i,i+500);
      const cells=part.map(e=>{const c=ctx.workbook.worksheets.getItem(e.sheet).getCell(e.row-1,e.col);c.load('values,formulas');return c;});
      await ctx.sync();
      part.forEach((e,k)=>{
        const cur=cells[k].values[0][0],f=cells[k].formulas[0][0];
        const same=e.isF?String(f)===String(e.nw):typeof e.nw==='number'?(cur!==''&&Number(cur)===e.nw):String(cur)===String(e.nw);
        if(same){
          if(e.old===null)cells[k].clear('Contents');else cells[k].values=[[e.old]];
          restored++;okByRow[e.di]++;
        }else{skipped++;koByRow[e.di]++;}
      });
      await ctx.sync();if(onProg)onProg(Math.min(i+500,items.length),items.length);
    }
    const stamp=nowStr();
    const marks=[[stamp+' · '+restored+' restaurée(s)'+(skipped?', '+skipped+' non restaurée(s) (modifiées depuis)':'')]].concat(det.map((d,di)=>[stamp+' · '+(koByRow[di]?(okByRow[di]?'partiel':'non restauré (modifié depuis)'):'restauré')]));
    const first=all[s].li;
    for(let i=0;i<marks.length;i+=5000){
      const part=marks.slice(i,i+5000);
      lw.getRangeByIndexes(first+i,8,part.length,1).values=part;await ctx.sync();
    }
    return {restored,skipped,total:items.length};
  })).then((r)=>{LOGBUS.bump();return r;});
}
/* garde le détail des N derniers lots, supprime celui des plus anciens (les résumés restent) */
async function purgeLog(keep){
  keep=keep||KEEP_LOTS;
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItemOrNullObject(LOG_SHEET);ws.load('isNullObject');await ctx.sync();
    if(ws.isNullObject)return {lots:0,rows:0};
    const ur=ws.getUsedRange(true);ur.load('rowCount');await ctx.sync();
    const N=ur.rowCount,C=[];
    for(let r0=1;r0<N;r0+=20000){
      const n=Math.min(20000,N-r0),rg=ws.getRangeByIndexes(r0,2,n,1);rg.load('values');await ctx.sync();
      rg.values.forEach(v=>C.push(v[0]));
    }
    const sums=[];C.forEach((x,i)=>{if(x==='Résumé')sums.push(i);});
    const old=sums.slice(0,Math.max(0,sums.length-keep));
    const spans=[];
    for(const s of old){let e=s;while(e+1<C.length&&C[e+1]==='Ligne')e++;if(e>s)spans.push([s,e]);}
    for(const [s] of spans){ws.getRangeByIndexes(s+1,7,1,1).values=[['purgé']];}
    await ctx.sync();
    let rows=0;
    for(let k=spans.length-1;k>=0;k--){const [s,e]=spans[k];ws.getRange((s+3)+':'+(e+2)).delete(Excel.DeleteShiftDirection.up);rows+=e-s;await ctx.sync();}
    return {lots:spans.length,rows};
  }).then((r)=>{LOGBUS.bump();return r;});
}

/* affichage des seules lignes concernées (réversible) */
async function showOnlyRows(sheet,firstRow,rows){
  const nums=[...new Set(rows)].sort((a,b)=>a-b);if(!nums.length)return 0;
  await Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(sheet);ws.activate();
    const ur=ws.getUsedRange(true);ur.load('rowIndex,rowCount');await ctx.sync();
    const last=ur.rowIndex+ur.rowCount;
    ws.getRange(firstRow+':'+last).rowHidden=false;
    const keep=new Set(nums);let a=null,n=0;
    for(let r=firstRow;r<=last+1;r++){
      const hide=r<=last&&!keep.has(r);
      if(hide&&a===null)a=r;
      if(!hide&&a!==null){ws.getRange(a+':'+(r-1)).rowHidden=true;a=null;n++;if(n%400===0)await ctx.sync();}
    }
    ws.getRange(nums[0]+':'+nums[0]).select();await ctx.sync();
  });
  return nums.length;
}
async function showAllRows(sheet,firstRow){
  await Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(sheet);
    const ur=ws.getUsedRange(true);ur.load('rowIndex,rowCount');await ctx.sync();
    ws.getRange(firstRow+':'+(ur.rowIndex+ur.rowCount)).rowHidden=false;await ctx.sync();
  });
}

function UpdateTab(p){
  const {onToast,onWritten}=p;
  const [step,setStep]=useState('files');       // files → scope → review → done
  const [files,setFiles]=useState([]);
  const [target,setTarget]=useState(null);
  const [counts,setCounts]=useState(null);
  const [scope,setScope]=useState('visible');
  const [picked,setPicked]=useState(false);
  const [track,setTrack]=useState(true);
  const [plan,setPlan]=useState(null);
  const [done,setDone]=useState(null);
  const [last,setLast]=useState(null);
  const [busy,setBusy]=useState('');
  const [prog,setProg]=useState('');
  const [err,setErr]=useState('');
  const [drag,setDrag]=useState(false);
  const [undoArmed,setUndoArmed]=useState(false);
  const live=useRef({});live.current={target,picked,step};
  const msg=(e)=>String(e&&e.message?e.message:e);
  const fr=(n)=>fmtN(n);
  const pl=(n,a,b)=>n>1?(b||a+'s'):a;

  const refreshLast=async()=>{try{setLast(await readLastBatch());}catch(e){setLast(null);}};
  useEffect(()=>{refreshLast();},[]);

  const recount=async(t,init)=>{
    const kc=keyColOf(t);if(kc===null){setCounts(null);return;}
    const c=await countScopes(t.sheet,kc,t.kind==='pivot'?2:t.gi.headerRow+1);
    setCounts(c);
    if(init||!live.current.picked)setScope(c.selection>1?'selection':(c.visible<c.all?'visible':'all'));
  };
  useEffect(()=>{
    if(step!=='scope')return;
    let timer=null;const fn=()=>{clearTimeout(timer);timer=setTimeout(()=>{const t=live.current.target;if(t&&live.current.step==='scope')recount(t,false).catch(()=>{});},500);};
    try{Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged,fn);}catch(e){}
    return ()=>{clearTimeout(timer);try{Office.context.document.removeHandlerAsync(Office.EventType.DocumentSelectionChanged,{handler:fn});}catch(e){}};
  },[step]);

  /* étape 1 */
  const addFiles=async(list)=>{
    setErr('');setBusy('read');
    const out=[...files];
    for(const f of Array.from(list)){
      const it={name:f.name};
      try{
        setProg('Lecture de '+f.name+'…');await new Promise(r=>setTimeout(r,20));
        const {rows,warn}=await readExportFile(f);
        const r=ApifyN.normalizeExport(rows,f.name);
        Object.assign(it,{platform:r.platform,by:r.detectedBy,stats:r.stats,records:r.records,skipped:r.skipped,warn,rowsN:rows.length});
        if(!r.platform)it.err='Fichier Apify non reconnu : ni le nom du fichier ni les colonnes ne correspondent. Gardez le nom d\'origine (ex. « dataset_instagram-scraper… »).';
      }catch(e){it.err=msg(e);}

    }

  };
  const okFiles=files.filter(f=>f.records&&f.records.length);
  const toScope=async(sheetName,force)=>{
    setErr('');setBusy('detect');setProg('Lecture du classeur…');
    try{const t=await detectTarget(sheetName,force);setTarget(t);setPlan(null);setStep('scope');await recount(t,true);}
    catch(e){setErr(msg(e));}

  };
  /* étape 2 → 3 */
  const analyse=async()=>{
    setErr('');setBusy('plan');
    try{
      const recs=okFiles.flatMap(f=>f.records);
      setProg(target.kind==='pivot'?'Lecture du pivot…':'Lecture de la feuille…');
      const pv=target.kind==='pivot'?await loadPivotForUpdate(scope,target.sheet):await loadGenericForUpdate(scope,target.gi,target.gmap);
      setProg('Comparaison…');await new Promise(r=>setTimeout(r,20));
