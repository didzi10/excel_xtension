      const res=PivotUpd.planUpdate(pv.rows,recs,{cols:pv.P,extractId:idOnly,scope:pv.scope,platforms,metrics:pv.metrics});
      const wr=buildWrites(pv,res,{track});
      setPlan({recap:PivotUpd.platformRecap(pv.rows,recs,res,{cols:pv.P,scope:pv.scope}),sheet:pv.sheet,kind:target.kind,nrows:pv.rows.length,scopeN:pv.scope?pv.scope.size:null,res,writes:wr.writes,counts:wr.counts,hdr:pv.hdr,firstRow:pv.firstIdx+1,track,scopeLabel:(scope==='all'?'tout le fichier':(scope==='selection'?'sélection':(counts&&counts.visible<counts.all?'données filtrées':'lignes visibles'))+(pv.scope?' · lignes '+rangesOf([...pv.scope]):'')),unknown:pv.unknown||0,bigIds:pv.bigIds||0,
        newCols:MAJ_COLS.filter(([k])=>!pv.newCols[k].exists).length});

  /* étape 3 → 4 */

async function readScoped(mode){
  const s=await getSel();
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(s.sheet);
    const ur=ws.getUsedRangeOrNullObject(true);ur.load('rowIndex,columnIndex,rowCount,columnCount,isNullObject');await ctx.sync();
    const out={sheet:s.sheet,cells:[],truncated:false,scanned:0};
    if(ur.isNullObject)return out;
    const R1=ur.rowIndex+ur.rowCount-1,C1=ur.columnIndex+ur.columnCount-1;
    let areas=s.areas;
    if(mode==='columns'){
      const cs=new Set();s.areas.forEach(a=>{for(let k=0;k<a.columnCount;k++)cs.add(a.columnIndex+k);});
      areas=[...cs].filter(c=>c>=ur.columnIndex&&c<=C1).sort((a,b)=>a-b).map(c=>({rowIndex:ur.rowIndex+1,rowCount:Math.max(0,ur.rowCount-1),columnIndex:c,columnCount:1}));
    }
    const seen=new Set(),rowsSeen=new Set();
    for(const a of areas){
      const r0=Math.max(a.rowIndex,0),r1=Math.min(a.rowIndex+a.rowCount-1,R1),c0=Math.max(a.columnIndex,0),c1=Math.min(a.columnIndex+a.columnCount-1,C1);
      if(r1<r0||c1<c0)continue;const w=c1-c0+1,step=Math.max(1,Math.floor(20000/w));
      for(let r=r0;r<=r1;r+=step){
        const n=Math.min(step,r1-r+1);
        if(out.scanned+n*w>300000){out.truncated=true;break;}
        const rg=ws.getRangeByIndexes(r,c0,n,w);rg.load('values,formulasR1C1,numberFormat');await ctx.sync();out.scanned+=n*w;
        for(let i=0;i<n;i++)for(let j=0;j<w;j++){
          const v=rg.values[i][j];if(v===''||v===null)continue;
          const key=(r+i)*16384+(c0+j);if(seen.has(key))continue;seen.add(key);
          out.cells.push({r:r+i,c:c0+j,v,f:rg.formulasR1C1[i][j],nf:rg.numberFormat[i][j]});
        }
      }
    }
    if(mode==='visible'&&out.cells.length){
      let lo=Infinity,hi=-1;out.cells.forEach(x=>{if(x.r<lo)lo=x.r;if(x.r>hi)hi=x.r;});
      const vr=ws.getRangeByIndexes(lo,ur.columnIndex,hi-lo+1,1).getSpecialCellsOrNullObject(Excel.SpecialCellType.visible);vr.load('isNullObject');await ctx.sync();
      const vis=new Set();
      if(!vr.isNullObject){vr.areas.load('items/rowIndex,items/rowCount');await ctx.sync();vr.areas.items.forEach(a=>{for(let k=0;k<a.rowCount;k++)vis.add(a.rowIndex+k);});}
      out.cells=out.cells.filter(x=>vis.has(x.r));
    }
    return out;
  });
}
/* nombres affichés sur les cartes de périmètre (sans lire les valeurs) */
async function countToolScopes(){
  const s=await getSel();
  return Excel.run(async(ctx)=>{
    const ws=ctx.workbook.worksheets.getItem(s.sheet);
    const ur=ws.getUsedRangeOrNullObject(true);ur.load('rowIndex,columnIndex,rowCount,columnCount,isNullObject');await ctx.sync();
    if(ur.isNullObject)return {sheet:s.sheet,selection:0,visible:0,columns:0};
    const R1=ur.rowIndex+ur.rowCount-1,C1=ur.columnIndex+ur.columnCount-1;
    let sel=0,vis=0;const cs=new Set();
    for(const a of s.areas){
      const r0=Math.max(a.rowIndex,0),r1=Math.min(a.rowIndex+a.rowCount-1,R1),c0=Math.max(a.columnIndex,0),c1=Math.min(a.columnIndex+a.columnCount-1,C1);
      if(r1<r0||c1<c0)continue;
      sel+=(r1-r0+1)*(c1-c0+1);for(let c=c0;c<=c1;c++)cs.add(c);
      const vr=ws.getRangeByIndexes(r0,ur.columnIndex,r1-r0+1,1).getSpecialCellsOrNullObject(Excel.SpecialCellType.visible);vr.load('isNullObject');await ctx.sync();
      if(vr.isNullObject)continue;
      vr.areas.load('items/rowCount');await ctx.sync();
      vis+=vr.areas.items.reduce((t,x)=>t+x.rowCount,0)*(c1-c0+1);
    }
    return {sheet:s.sheet,selection:sel,visible:vis,columns:cs.size*Math.max(0,ur.rowCount-1)};
  });
}

        h('button',{style:{...BTN_B,...big,flex:1},disabled:!!busy||!idsReady||(c&&!c[scope]&&scope!=='columns'&&false),onClick:analyse},'Voir ce qui va changer →')));

  const screenReview=()=>{
    if(!plan)return null;

        h('div',{style:{fontWeight:800,fontSize:'1rem',marginBottom:8,color:n?'#166534':'#475569'}},n?fmtN(n)+' cellule'+pl(n,'')+(n>1?' vont':' va')+' être modifiée'+pl(n,''):'Rien à modifier'),

        ign.length?h('div',{style:{fontSize:'.74rem',color:'#64748b'}},'Ignorées : '+ign.map(k=>plan.ign[k]+' '+k).join(' · ')):null,

        plan.truncated?h('div',{style:{fontSize:'.72rem',color:'#b45309',marginTop:4}},'⚠️ Zone très grande : seules les 300 000 premières cellules ont été analysées.'):null),
      n?h('div',{style:{...box,padding:'.5rem .8rem'}},
        h('div',{style:{fontWeight:700,fontSize:'.78rem',marginBottom:4}},'Aperçu'),
        h('div',{style:{overflowX:'auto'}},h('table',{style:{width:'100%',borderCollapse:'collapse'}},h('tbody',null,

  const screenDone=()=>done?h('div',null,

  return h('div',null,step==='home'?screenHome():step==='setup'?screenSetup():step==='review'?screenReview():screenDone());

const h=React.createElement;
const LV={
  b:{ic:'🔴',col:'#b91c1c',bg:'#fef2f2',bd:'#fecaca'},
  v:{ic:'🟠',col:'#b45309',bg:'#fffbeb',bd:'#fde68a'},
  i:{ic:'ℹ️',col:'#0369a1',bg:'#f0f9ff',bd:'#bae6fd'},
  ok:{ic:'✅',col:'#15803d',bg:'#f0fdf4',bd:'#bbf7d0'}
};
const btn=(bg,col,bd)=>({padding:'4px 9px',background:bg,color:col,border:'1px solid '+bd,borderRadius:6,fontSize:'.74rem',fontWeight:700,cursor:'pointer'});
const BTN_N=btn('#f1f5f9','#334155','#cbd5e1'),BTN_B=btn('#2563eb','#fff','#2563eb'),BTN_F=btn('#fff7ed','#c2410c','#fdba74');

/* Sécurité : les messages embarquent des valeurs de cellules ; on ne garde que des balises de mise en forme, sans attribut dangereux */
const OK_TAGS={B:1,STRONG:1,I:1,EM:1,BR:1,SPAN:1,DIV:1,P:1,UL:1,OL:1,LI:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,CODE:1,SMALL:1,SUB:1,SUP:1,U:1,S:1};
const esc=(t)=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const safeStyle=(v)=>/url\s*\(|expression|@import|javascript:|position\s*:\s*(fixed|absolute)/i.test(v)?'':v;
function sanitize(html){
  let doc;try{doc=new DOMParser().parseFromString('<body>'+String(html==null?'':html)+'</body>','text/html');}catch(e){return esc(html);}
  const walk=(node)=>{let o='';
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){o+=esc(n.nodeValue);return;}
      if(n.nodeType!==1)return;
      const t=n.tagName;
      if(!OK_TAGS[t]){o+=walk(n);return;} /* balise inconnue (script, img, iframe, a…) : on garde le texte seulement */
      let at='';const st=n.getAttribute('style');
      if(st){const c=safeStyle(st);if(c)at=' style="'+c.replace(/"/g,'&quot;')+'"';}
      if(t==='TD'||t==='TH'){const cs=parseInt(n.getAttribute('colspan'),10);if(cs>0&&cs<20)at+=' colspan="'+cs+'"';}
      o+=t==='BR'?'<br>':'<'+t.toLowerCase()+at+'>'+walk(n)+'</'+t.toLowerCase()+'>';
    });return o;};
  return walk(doc.body);
}
const safeUrl=(u)=>{try{const x=new URL(String(u).trim());return(x.protocol==='https:'||x.protocol==='http:')?x.href:null;}catch(e){return null;}};
const linkify=(html0,sec,id)=>{
  const html=sanitize(html0);
  let out=html.replace(/([Ll]ignes?\s*(?::\s*)?)((?:\d+(?:,\s*)?)+)/g,(m,a,b)=>a+b.split(/,\s*/).filter(Boolean).map(n=>`<a class="rl" data-sec="${sec}" data-row="${n}">${n}</a>`).join(', '));
  if(id==='c28')out=out.replace(/\b([A-Z]{1,3}\d+)\b/g,(m)=>`<a class="rl" data-sec="TABLEAUX" data-addr="${m}">${m}</a>`);
  return out;
};
const stripHtml=(s)=>String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/tr>/gi,'\n').replace(/<\/t[dh]>/gi,' | ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').trim();
const short=(n)=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e3?Math.round(n/1e3)+' k':String(Math.round(n));

function Group(p){

function Picker(p){
  const {value,onChange,options,warn,placeholder}=p;
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState('');
  const cur=options.find(o=>o.value===value);
  const flt=q?options.filter(o=>String(o.label).toLowerCase().indexOf(q.toLowerCase())>=0):options;
  let lastG=null;
  const items=[];
  flt.forEach((o,i)=>{
    if(o.group&&o.group!==lastG){lastG=o.group;items.push(h('div',{key:'g'+i,style:{fontSize:'.66rem',fontWeight:800,color:'#94a3b8',padding:'4px 6px 1px',textTransform:'uppercase'}},o.group));}
    const sel=o.value===value;
    items.push(h('div',{key:'o'+i,onClick:()=>{onChange(o.value);setOpen(false);setQ('');},style:{padding:'4px 8px',fontSize:'.76rem',cursor:'pointer',borderRadius:5,background:sel?'#dbeafe':'transparent',fontWeight:sel?700:400,color:'#1e293b'}},o.label));
  });
  return h('div',{style:{display:'inline-block',maxWidth:'100%',verticalAlign:'top'}},
    h('button',{onClick:()=>setOpen(!open),style:{padding:'3px 8px',background:'#fff',border:'1px solid '+(warn?'#dc2626':'#cbd5e1'),color:warn?'#dc2626':'#334155',fontWeight:warn?700:500,borderRadius:6,fontSize:'.74rem',cursor:'pointer',textAlign:'left',maxWidth:230,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},(cur?cur.label:(placeholder||'—'))+' ▾'),
    open?h('div',{style:{marginTop:3,background:'#fff',border:'1px solid #cbd5e1',borderRadius:8,padding:4,maxHeight:220,overflowY:'auto',minWidth:200}},
      options.length>8?h('input',{value:q,onChange:ev=>setQ(ev.target.value),placeholder:'Rechercher…',style:{width:'100%',fontSize:'.74rem',padding:'3px 6px',marginBottom:4,border:'1px solid #cbd5e1',borderRadius:6}}):null,
      items.length?items:h('div',{style:{padding:'4px 8px',fontSize:'.74rem',color:'#94a3b8'}},'Aucun résultat')):null);
}

function BrandSelect(p){
  const {cols,detected,value,onChange}=p;const on=!!value&&cols.indexOf(value)>=0;

    h('div',{style:{position:'sticky',top:0,zIndex:50,background:'#f0f4f8',padding:'.6rem 0 .5rem'}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6}},
        h('h1',{style:{fontSize:'1rem',fontWeight:800,margin:0}},'🔍 Vérificateur Pivot'),
        h('div',{style:{display:'flex',gap:5}},
          h('button',{style:BTN_B,disabled:busy,onClick:()=>run()},'↻ Relancer'),
          h('button',{style:BTN_N,title:'Copier le rapport',onClick:copyReport,disabled:!results.length},'📋'),
          h('button',{style:BTN_N,onClick:()=>setShowHelp(true)},'❓'))),
      h('div',{style:{display:'flex',gap:6,marginTop:7}},
        h('button',{onClick:()=>setTab('maj'),style:{...btn(tab==='maj'?'#1e293b':'#fff',tab==='maj'?'#fff':'#334155','#1e293b'),flex:1}},'🔄 Mise à jour'),
        h('button',{onClick:()=>setTab('verif'),style:{...btn(tab==='verif'?'#1e293b':'#fff',tab==='verif'?'#fff':'#334155','#1e293b'),flex:1}},'🔍 Vérifications'),

        chip('🔴 '+bl.length+' bloquant'+(bl.length>1?'s':''),bl.length?'#fee2e2':'#e2e8f0',bl.length?'#b91c1c':'#64748b'),

        chip('✅ '+oks.length+' OK','#dcfce7','#15803d'),
        nRes?chip('✓ '+nRes+' corrigé'+(nRes>1?'s':''),'#dbeafe','#1d4ed8'):null,

        h('label',{style:{marginLeft:'auto',fontSize:'.7rem',color:'#475569',cursor:'pointer',whiteSpace:'nowrap'},title:'Relance l\'analyse quelques secondes après chaque modification du classeur'},h('input',{type:'checkbox',checked:auto,onChange:toggleAuto,style:{marginRight:4,verticalAlign:'middle'}}),'Relance auto')):null),

    err?h('div',{style:{background:'#fef2f2',border:'1px solid #fca5a5',color:'#b91c1c',borderRadius:8,padding:'.5rem .7rem',fontSize:'.8rem',marginBottom:8}},'⚠️ '+err):null,
    toast?h('div',{onClick:()=>setToast(''),style:{background:'#eff6ff',border:'1px solid #bfdbfe',color:'#1e40af',borderRadius:8,padding:'.45rem .7rem',fontSize:'.78rem',marginBottom:8,cursor:'pointer'}},toast):null,

    h('div',{style:{display:tab==='verif'?'block':'none'}},
    info?h('div',{style:{background:'#fff',border:'1px solid #e2e8f0',borderRadius:9,padding:'.5rem .7rem',marginBottom:10,fontSize:'.77rem'}},
      h('span',null,h('strong',null,info.rows),' lignes dans DATA  '),
      info.sheets.map(({ex,found})=>h('span',{key:ex,style:{display:'inline-block',margin:'2px 3px 0 0',padding:'0 7px',borderRadius:12,fontSize:'.7rem',fontWeight:600,background:found?'#dcfce7':'#fee2e2',color:found?'#16a34a':'#dc2626'}},(found?'✓ ':'✗ ')+ex))):null,

      h('span',null,'🔎 Filtre actif sur '+filtered.sec+' : '+filtered.n+' ligne'+(filtered.n>1?'s':'')+' affichée'+(filtered.n>1?'s':'')),

    guide,
    (results.length&&(rowsB.length||rowsAll.length))?h('div',{style:{display:'flex',flexWrap:'wrap',alignItems:'center',gap:6,marginBottom:10,fontSize:'.76rem',color:'#475569'}},

      (rowsAll.length>rowsB.length)?h('button',{style:BTN_N,onClick:()=>doFilter('DATA',rowsAll,'Filtre alertes')},'toutes les alertes ('+rowsAll.length+')'):null):null,

    h('div',{onClick:onClickReport},
      results.length&&!bl.length&&!vf.length?h('div',{style:{background:'#f0fdf4',border:'2px solid #86efac',borderRadius:10,padding:'.7rem .85rem',color:'#16a34a',fontWeight:700,marginBottom:10,fontSize:'.86rem'}},'✅ Aucun point à corriger. Le pivot est prêt.'):null,

      h(Group,{title:'🔴 Bloquants',accent:'#b91c1c',count:bl.length,open:openG.has('b'),onToggle:()=>flip(setOpenG,'b')},bl.map(r=>cardFor(r,'b'))),
      h(Group,{title:'🟠 À vérifier',accent:'#b45309',count:vf.length,open:openG.has('v'),onToggle:()=>flip(setOpenG,'v')},vf.map(r=>cardFor(r,'v'))),
      h(Group,{title:'✓ Corrigés depuis la première analyse',accent:'#1d4ed8',count:nRes,open:openG.has('fixed'),onToggle:()=>flip(setOpenG,'fixed')},
        Object.entries(resolved).map(([id,lb])=>h('div',{key:id,style:{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:8,padding:'6px 10px',marginBottom:5,fontSize:'.78rem',color:'#1e40af'}},'✓ '+lb))),

    h('div',{style:{display:tab==='maj'?'block':'none'},onClick:onClickReport},h(UpdateTab,{onToast:setToast,onWritten:()=>{if(!(window.__realNames&&window.__realNames.DATA))return;quietRef.current=Date.now()+4000;setTimeout(()=>runRef.current&&runRef.current(undefined,true),600);}})));
